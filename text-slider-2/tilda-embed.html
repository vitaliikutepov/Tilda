<!-- ============================================================
     Текстовый слайдер 2 для Tilda Zero Block
     Страница: https://form.ptsecurity.com/h1bg-special
     Блок: #rec3367388301

     Как подключить:
     1. В зеро-блоке уже должны быть:
        - стрелки  .main-slider-left-2  /  .main-slider-right-2
        - текст    .slider-text-3
        - обёртка  .text-slider-2
        - пагинация: группы .cslide4-1 … .cslide4-4
          и шейпы  .slide4-1 … .slide4-4
          Пятый пункт скрипт клонирует сам.
        Активный пункт — короткая полоска, остальные — точки 4px.
     2. Вставьте весь этот файл в HTML-элемент Тильды
        (в блок слайдера или в настройки страницы).
     3. Тексты меняются в массиве SLIDE_TEXTS ниже.

     Сниппет не пересекается с первым слайдером (#rec3351087301):
     все селекторы ограничены этим рекордом.

     Поведение:
     - автосмена каждые 5 секунд;
     - текст fill + autoheight: фейд 0.5с, без hug (стрелки по бокам);
     - высота текста едет 0.5с, пагинация скользит вместе с ней;
     - у активного пункта пагинации серый трек + белый прогресс;
     - остальные пункты — белые точки;
     - клик по стрелке / точке и свайп сбрасывают таймер;
     - наведение на блок ставит автоплей на паузу.
============================================================ -->

<script>
(function () {
  'use strict';

  if (window.__ptsTextSlider2Init) return;

  /* ==================== НАСТРОЙКИ ==================== */

  var REC_SEL = '#rec3367388301';

  var SLIDE_TEXTS = [
    'Ведущий разработчик продуктов, решений и сервисов для выявления и предотвращения кибератак до того, как они причинят неприемлемый ущерб бизнесу',
    'Специалисты Positive Technologies участвуют в разработке требований информационной безопасности в составе рабочих групп ФСТЭК России, Банка России и других регуляторов',
    'Positive Technologies — один из лидеров в области результативной кибербезопасности',
    'Чтобы продемонстрировать эффективность результативного подхода к кибербезопасности, компания проводит киберучения на собственной инфраструктуре и публично тестирует свои продукты',
    'Первая и пока единственная компания из сферы кибербезопасности на Московской бирже (MOEX: POSI). Количество акционеров превышает 220 тысяч'
  ];

  var AUTOPLAY_MS = 5000;
  var SWIPE_PX = 48;
  var TEXT_OPACITY = '0.8';

  var TEXT_MAX = {
    320: 280,
    768: 616,
    1024: 1002,
    1366: 864,
    1920: 864
  };

  /* =================================================== */

  var active = 0;
  var pagItems = [];
  var textEl = null;
  var textAtom = null;
  var hostEl = null;
  var rowWrapEl = null;
  var pagerWrapEl = null;
  var textTimers = [];
  var heightMeasurer = null;
  var autoplayPaused = false;
  var autoplayStart = null;
  var autoplayTimer = null;
  var lastFrame = null;
  var rafId = 0;
  var lastGoAt = 0;
  var currentBp = null;

  function rootEl() {
    return document.querySelector(REC_SEL) ||
      document.querySelector('.text-slider-2') ||
      document.querySelector('.pts-text-slider-v2');
  }

  function q(sel, root) {
    return (root || hostEl || rootEl() || document).querySelector(sel);
  }

  function breakpointId() {
    var w = window.innerWidth;
    if (w >= 1920) return 1920;
    if (w >= 1366) return 1366;
    if (w >= 1024) return 1024;
    if (w >= 768) return 768;
    return 320;
  }

  function isPhoneLayout() {
    return !!(window.matchMedia &&
      window.matchMedia('(max-width: 767px)').matches);
  }

  function textMaxWidth() {
    return TEXT_MAX[breakpointId()] || 864;
  }

  function ensurePagFill(bar) {
    if (!bar) return null;
    var atom = q('.tn-atom', bar) || bar;
    var fill = q('.pt-pag-fill', atom);
    if (!fill) {
      fill = document.createElement('span');
      fill.className = 'pt-pag-fill';
      atom.appendChild(fill);
    }
    return fill;
  }

  function ensurePagerCount(root, count) {
    var first = q('.cslide4-1', root);
    if (!first || !first.parentElement) return;
    var parent = first.parentElement;
    parent.classList.add('pts-text-pager');
    for (var n = 2; n <= count; n++) {
      if (q('.cslide4-' + n, root)) continue;
      var clone = first.cloneNode(true);
      clone.className = String(clone.className || '')
        .replace(/cslide4-\d+/g, 'cslide4-' + n)
        .replace(/\bis-on\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      var slide = clone.querySelector('[class*="slide4-"]');
      if (slide) {
        slide.className = String(slide.className || '')
          .replace(/slide4-\d+/g, 'slide4-' + n);
      }
      var fills = clone.querySelectorAll('.pt-pag-fill');
      for (var i = 0; i < fills.length; i++) {
        if (fills[i].parentNode) fills[i].parentNode.removeChild(fills[i]);
      }
      parent.appendChild(clone);
    }
    parent.classList.add('pts-text-pager');
    var el = first.parentElement;
    while (el && el !== root) {
      var cls = String(el.className || '');
      if ((/\btn-group\b|\bt396__group\b|\bpag-row\b/.test(cls)) &&
          !/\bcslide4-/.test(cls)) {
        pagerWrapEl = el;
        break;
      }
      el = el.parentElement;
    }
    if (!pagerWrapEl) pagerWrapEl = parent;
    pagerWrapEl.classList.add('pts-text-pager-wrap');
    pinFlowEl(pagerWrapEl);
  }

  function syncPagination() {
    for (var i = 0; i < pagItems.length; i++) {
      var item = pagItems[i];
      if (!item || !item.wrap) continue;
      var on = i === active;
      if (on && item.fill) {
        item.fill.style.transform = 'scaleX(0)';
      }
      item.wrap.classList.toggle('is-on', on);
      item.wrap.setAttribute('aria-current', on ? 'true' : 'false');
      if (!on && item.fill) {
        item.fill.style.transform = '';
      }
    }
  }

  function setFillProgress(p) {
    var item = pagItems[active];
    if (!item || !item.fill) return;
    p = Math.max(0, Math.min(1, p));
    item.fill.style.transform = 'scaleX(' + p + ')';
  }

  function stopAutoplay() {
    autoplayPaused = true;
    clearTimeout(autoplayTimer);
  }

  function remainingMs() {
    if (autoplayStart == null) return AUTOPLAY_MS;
    var elapsed = performance.now() - autoplayStart;
    return Math.max(16, AUTOPLAY_MS - elapsed);
  }

  function armAutoplay() {
    clearTimeout(autoplayTimer);
    if (autoplayPaused || document.hidden) return;
    autoplayTimer = setTimeout(function () {
      go(active + 1, false, true);
    }, remainingMs());
  }

  function startAutoplay() {
    autoplayPaused = false;
    armAutoplay();
  }

  function loop(now) {
    if (autoplayStart === null) autoplayStart = now;
    if (lastFrame === null) lastFrame = now;
    if (autoplayPaused) autoplayStart += now - lastFrame;
    lastFrame = now;
    var p = (now - autoplayStart) / AUTOPLAY_MS;
    if (p < 0) p = 0;
    if (p > 1) p = 1;
    setFillProgress(p);
    rafId = requestAnimationFrame(loop);
  }

  function pinFlowEl(el) {
    if (!el) return;
    el.style.setProperty('position', 'relative', 'important');
    el.style.setProperty('top', 'auto', 'important');
    el.style.setProperty('left', 'auto', 'important');
    el.style.setProperty('right', 'auto', 'important');
    el.style.setProperty('bottom', 'auto', 'important');
    el.style.setProperty('height', 'auto', 'important');
    el.style.setProperty('transform', 'none', 'important');
  }

  function pinSliderFlow() {
    if (textEl) {
      var rowWrap = textEl.closest
        ? textEl.closest('.tn-group, .t396__group, .pts-text-row')
        : textEl.parentElement;
      if (rowWrap && rowWrap !== hostEl) {
        rowWrapEl = rowWrap;
        rowWrapEl.classList.add('pts-text-row-wrap');
        pinFlowEl(rowWrapEl);
      }
    }
    if (pagerWrapEl) pinFlowEl(pagerWrapEl);
    var col = (hostEl && hostEl.querySelector)
      ? (hostEl.matches && hostEl.matches('.text-slider-2')
        ? hostEl
        : hostEl.querySelector('.text-slider-2'))
      : null;
    if (col) {
      col.style.setProperty('height', 'auto', 'important');
      col.style.setProperty('overflow', 'visible', 'important');
      var mol = null;
      var kids = col.children || [];
      for (var i = 0; i < kids.length; i++) {
        if (/\btn-molecule\b/.test(kids[i].className || '')) {
          mol = kids[i];
          break;
        }
      }
      if (mol) {
        mol.style.setProperty('height', 'auto', 'important');
        mol.style.setProperty('overflow', 'visible', 'important');
      }
    }
  }

  function boxWidthPx() {
    if (!textEl) return textMaxWidth();
    var w = textEl.clientWidth || textEl.offsetWidth || 0;
    var cap = textMaxWidth();
    if (isPhoneLayout()) cap = Math.min(cap, 280);
    if (w > 40) return Math.min(w, cap);
    return cap;
  }

  function measureHeight(str) {
    if (!textAtom) return 0;
    if (!heightMeasurer) {
      heightMeasurer = document.createElement('div');
      heightMeasurer.setAttribute('aria-hidden', 'true');
      heightMeasurer.style.cssText =
        'position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1;';
      var mount = (textEl && textEl.parentNode) || hostEl || document.body;
      mount.appendChild(heightMeasurer);
    }
    var cs = getComputedStyle(textAtom);
    var w = boxWidthPx();
    heightMeasurer.style.boxSizing = 'border-box';
    heightMeasurer.style.width = w + 'px';
    heightMeasurer.style.maxWidth = w + 'px';
    heightMeasurer.style.padding = cs.padding;
    heightMeasurer.style.font = cs.font;
    heightMeasurer.style.fontSize = cs.fontSize;
    heightMeasurer.style.fontFamily = cs.fontFamily;
    heightMeasurer.style.fontWeight = cs.fontWeight;
    heightMeasurer.style.lineHeight = cs.lineHeight;
    heightMeasurer.style.letterSpacing = cs.letterSpacing;
    heightMeasurer.style.whiteSpace = 'normal';
    heightMeasurer.style.overflowWrap = 'break-word';
    heightMeasurer.style.wordBreak = cs.wordBreak || 'normal';
    heightMeasurer.style.textAlign = cs.textAlign || 'center';
    heightMeasurer.textContent = str;
    return Math.max(1, Math.ceil(heightMeasurer.scrollHeight));
  }

  function rowHeightForText(textH) {
    var h = Math.max(0, Math.round(textH || 0));
    if (isPhoneLayout()) return h;
    var left = hostEl && q('.main-slider-left-2', hostEl);
    if (left && getComputedStyle(left).display !== 'none') {
      h = Math.max(h, left.offsetHeight || 0);
    }
    return h;
  }

  function syncPagerTop(textH, animate) {
    if (!pagerWrapEl) return;
    var pos = getComputedStyle(pagerWrapEl).position;
    if (pos !== 'absolute' && pos !== 'fixed') return;
    var gap = isPhoneLayout() ? 16 : 20;
    var top = rowHeightForText(textH) + gap;
    pagerWrapEl.style.setProperty(
      'transition',
      animate ? 'top 0.5s cubic-bezier(.25,.1,.25,1)' : 'none',
      'important'
    );
    pagerWrapEl.style.setProperty('top', top + 'px', 'important');
  }

  function lockHeight(h, animate) {
    if (!textEl) return;
    var px = Math.max(0, Math.round(h)) + 'px';
    textEl.style.setProperty(
      'transition',
      animate ? 'height 0.5s cubic-bezier(.25,.1,.25,1)' : 'none',
      'important'
    );
    textEl.style.setProperty('height', px, 'important');
    syncPagerTop(h, animate);
  }

  function fitTextBox() {
    if (!textEl) return;
    var maxW = isPhoneLayout() ? 'min(280px, 100%)' : (textMaxWidth() + 'px');
    textEl.style.setProperty('white-space', 'normal', 'important');
    textEl.style.setProperty('width', '100%', 'important');
    textEl.style.setProperty('max-width', maxW, 'important');
    textEl.style.setProperty('flex-grow', '1', 'important');
    textEl.style.setProperty('flex-shrink', '1', 'important');
    textEl.style.setProperty('flex-basis', 'auto', 'important');
    textEl.style.setProperty('min-width', '0px', 'important');
    textEl.style.setProperty('overflow', 'hidden', 'important');
    if (textAtom) {
      textAtom.style.setProperty('white-space', 'normal', 'important');
      textAtom.style.setProperty('max-width', '100%', 'important');
      textAtom.style.setProperty('overflow', 'visible', 'important');
    }
  }

  function setAtomOpacity(value) {
    if (!textAtom) return;
    textAtom.style.setProperty('opacity', value, 'important');
  }

  function setText(immediate) {
    if (!textAtom || !textEl) return;
    var str = SLIDE_TEXTS[active] || '';

    textTimers.forEach(clearTimeout);
    textTimers = [];

    textAtom.style.setProperty('transition', 'opacity 0.5s ease', 'important');
    pinSliderFlow();
    fitTextBox();

    var fromH = textEl.offsetHeight || measureHeight(textAtom.textContent || str);
    var toH = measureHeight(str);

    if (immediate) {
      textAtom.textContent = str;
      fitTextBox();
      lockHeight(toH, false);
      setAtomOpacity(TEXT_OPACITY);
      return;
    }

    lockHeight(fromH, false);
    setAtomOpacity('0');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        lockHeight(toH, true);
      });
    });

    textTimers.push(setTimeout(function () {
      textAtom.textContent = str;
      fitTextBox();
      lockHeight(toH, false);
    }, 500));
    textTimers.push(setTimeout(function () {
      setAtomOpacity(TEXT_OPACITY);
    }, 1000));
  }

  function applyActive(immediate) {
    setText(immediate);
    syncPagination();
  }

  function go(index, immediate, fromAutoplay) {
    var n = SLIDE_TEXTS.length;
    if (!n) return;
    var t = performance.now();
    if (fromAutoplay && lastGoAt && t - lastGoAt < 400) return;
    if (!immediate && !fromAutoplay && lastGoAt && t - lastGoAt < 40) return;
    lastGoAt = t;
    active = ((index % n) + n) % n;
    autoplayStart = t;
    lastFrame = null;
    applyActive(immediate);
    setFillProgress(0);
    startAutoplay();
  }

  function bindClick(el, fn) {
    if (!el) return;
    el.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      fn();
      var ae = document.activeElement;
      if (ae && ae.blur) ae.blur();
    }, true);
  }

  function bindSwipe(el) {
    if (!el) return;
    var x0 = 0;
    var y0 = 0;
    var axis = '';

    el.addEventListener('touchstart', function (e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var t = e.changedTouches[0];
      x0 = t.clientX;
      y0 = t.clientY;
      axis = '';
    }, { passive: true });

    el.addEventListener('touchmove', function (e) {
      if (axis === 'v') return;
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0;
      var dy = t.clientY - y0;
      if (!axis) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      }
      if (axis === 'h' && e.cancelable) e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchend', function (e) {
      if (axis !== 'h') return;
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - x0;
      axis = '';
      if (Math.abs(dx) < SWIPE_PX) return;
      if (dx < 0) go(active + 1);
      else go(active - 1);
    });

    el.addEventListener('touchcancel', function () {
      axis = '';
    });
  }

  function showSliderGroup() {
    if (!hostEl || !hostEl.querySelectorAll) return;
    var nodes = hostEl.querySelectorAll('.t-animate');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].style.setProperty('opacity', '1', 'important');
      nodes[i].style.setProperty('transform', 'none', 'important');
      nodes[i].style.setProperty('animation', 'none', 'important');
    }
  }

  function init() {
    hostEl = rootEl();
    if (!hostEl) return;
    hostEl.classList.add('pts-text-slider-v2');

    textEl = q('.slider-text-3', hostEl);
    if (!textEl) return;
    textAtom = q('.tn-atom', textEl) || textEl;
    pinSliderFlow();
    if (isPhoneLayout()) showSliderGroup();

    ensurePagerCount(hostEl, SLIDE_TEXTS.length);
    pinSliderFlow();

    pagItems = [];
    var count = SLIDE_TEXTS.length;
    for (var n = 1; n <= count; n++) {
      var wrap = q('.cslide4-' + n, hostEl);
      var bar = q('.slide4-' + n, hostEl);
      var fill = ensurePagFill(bar);
      pagItems.push({ wrap: wrap, bar: bar, fill: fill });
      if (!wrap) continue;
      wrap.setAttribute('role', 'button');
      wrap.setAttribute('aria-label', 'Слайд ' + n);
      (function (idx) {
        bindClick(wrap, function () { go(idx); });
      })(n - 1);
    }

    bindClick(q('.main-slider-left-2', hostEl), function () {
      go(active - 1);
    });
    bindClick(q('.main-slider-right-2', hostEl), function () {
      go(active + 1);
    });
    bindSwipe(hostEl);

    var hoverEl = q('.text-slider-2', hostEl) || textEl;
    if (hoverEl && window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      hoverEl.addEventListener('mouseenter', stopAutoplay);
      hoverEl.addEventListener('mouseleave', startAutoplay);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopAutoplay();
      else startAutoplay();
    });

    currentBp = breakpointId();
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var bp = breakpointId();
        if (bp === currentBp) return;
        currentBp = bp;
        if (heightMeasurer && heightMeasurer.parentNode) {
          heightMeasurer.parentNode.removeChild(heightMeasurer);
          heightMeasurer = null;
        }
        if (isPhoneLayout()) showSliderGroup();
        setText(true);
      }, 250);
    });

    go(0, true);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function waitAndInit() {
    var started = Date.now();
    (function poll() {
      var root = rootEl();
      var text = root && root.querySelector('.slider-text-3');
      var first = root && root.querySelector('.cslide4-1');
      if ((text && first) || Date.now() - started > 2500) {
        if (text) init();
        return;
      }
      if (Date.now() - started < 20000) setTimeout(poll, 100);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
