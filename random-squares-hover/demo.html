<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Demo: random squares hover</title>
<style>
  body { font-family: sans-serif; background: #14161a; padding: 40px; }
  .t396__group {
    width: 520px; padding: 32px; border-radius: 16px;
    background: #1e2128; color: #fff; cursor: pointer;
    margin-bottom: 24px;
  }
  .tn-atom__html svg { display: block; }
  .card-text { margin-top: 24px; font-size: 20px; line-height: 28px; }
</style>
</head>
<body>

<!-- Упрощённая копия карточки из Zero Block -->
<div class="t396__group tn-group card-animation1">
  <div class="tn-molecule">
    <div class="t396__elem tn-elem">
      <div class="tn-atom tn-atom__html">
        <svg class="random-squares-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect class="sq" x="12" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="36" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="12" y="24" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
          <rect class="sq" x="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="24" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="24" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="36" y="24" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
          <rect class="sq" x="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
        </svg>
      </div>
    </div>
    <div class="t396__elem tn-elem">
      <div class="tn-atom card-text">Прикладные кейсы внедрения PT Sandbox и PT NAD от заказчиков</div>
    </div>
  </div>
</div>

<!-- Вторая карточка: иконка с красными углами -->
<div class="t396__group tn-group card-animation2">
  <div class="tn-molecule">
    <div class="t396__elem tn-elem">
      <div class="tn-atom tn-atom__html">
        <svg class="random-squares-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect class="sq" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
          <rect class="sq" y="48" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
          <rect class="sq" x="12" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="24" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="24" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="36" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="12" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="24" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
          <rect class="sq" x="36" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"></rect>
          <rect class="sq" x="48" y="48" width="12" height="12" fill="#F40D01" fill-opacity="1"></rect>
        </svg>
      </div>
    </div>
    <div class="t396__elem tn-elem">
      <div class="tn-atom card-text">Вторая карточка</div>
    </div>
  </div>
</div>

<!-- Сюда подключается тот же код, что вставляется в Tilda -->
<style>
  .random-squares-icon .sq {
    transition: fill .25s ease, fill-opacity .25s ease;
  }
</style>
<script src="random-squares-hover.js"></script>

</body>
</html>
