  SVG-иконка для второй карточки (card-animation2).
  Вставить в HTML-элемент внутри группы Zero Block с классом card-animation2.

  Отдельный скрипт не нужен: random-squares-hover.html уже обрабатывает
  все карточки, у которых класс начинается с «card-animation».
  Важно лишь, чтобы у <svg> был класс random-squares-icon,
  а у каждого <rect> — класс sq.
-->

  <rect class="sq" width="12" height="12" fill="#F40D01"/>
  <rect class="sq" y="48" width="12" height="12" fill="#F40D01"/>
  <rect class="sq" x="12" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="24" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="24" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="36" y="12" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="12" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="24" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="48" y="24" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>

  <rect class="sq" x="36" y="36" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="48" y="48" width="12" height="12" fill="#F40D01"/>
</svg>
