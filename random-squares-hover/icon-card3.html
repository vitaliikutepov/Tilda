<!--
  SVG-иконка для третьей карточки (card-animation3).
  Вставить в HTML-элемент внутри группы Zero Block с классом card-animation3.

  Отдельный скрипт не нужен: random-squares-hover.html уже обрабатывает
  все карточки, у которых класс начинается с «card-animation».

  Формат такой же, как у первой иконки:
  - у <svg> класс random-squares-icon, у каждого <rect> — класс sq;
  - у красных квадратов явно указан fill-opacity="1", чтобы скрипт
    корректно восстанавливал их после ухода курсора.
-->
<svg class="random-squares-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect class="sq" x="12" y="24" width="12" height="12" fill="#F40D01" fill-opacity="1"/>
  <rect class="sq" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="24" y="36" width="12" height="12" fill="#F40D01" fill-opacity="1"/>
  <rect class="sq" x="24" y="12" width="12" height="12" fill="#F40D01" fill-opacity="1"/>
  <rect class="sq" x="36" y="24" width="12" height="12" fill="#F40D01" fill-opacity="1"/>
  <rect class="sq" x="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
  <rect class="sq" x="48" y="48" width="12" height="12" fill="#97A1B0" fill-opacity="0.2"/>
</svg>
