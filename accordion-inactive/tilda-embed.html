<!-- ============================================================
     Неактивные аккордеоны направлений (Tilda Zero Block)

     Страница: https://pt-start.ptsecurity.com/fast-track

     Как подключить:
     1. В INACTIVE_IDS ниже перечислите id блоков-шапок аккордеона
        через запятую (с # или без). Классы в Тильде задавать не нужно.
     2. Вставьте весь этот файл в HTML-элемент Тильды
        (в настройки страницы или отдельный HTML-блок ниже аккордеонов).
============================================================ -->

<style>
  .pts-acc-inactive {
    position: relative;
    overflow: visible !important;
  }

  /* На мобилке место в потоке под полосой со стикером */
  .pts-acc-spacer {
    display: none;
    width: 100%;
    height: 0;
    pointer-events: none;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .pts-acc-inactive .t396,
  .pts-acc-inactive .t396__artboard,
  .pts-acc-host,
  .pts-acc-card {
    overflow: visible !important;
  }

  .pts-acc-host {
    position: relative !important;
    z-index: 2;
  }

  /* обёртка: на мобилке клипит низ в 12px, чтобы spacer не перекрывал скругление */
  .pts-acc-round {
    position: absolute;
    inset: 0;
    z-index: 19;
    overflow: visible;
    pointer-events: none;
    border-radius: 16px;
  }

  .pts-acc-inactive .t396__filter {
    pointer-events: none;
  }

  /* фон карточки не трогаем; ховер Тильды не доходит — pointer-events none */
  .pts-acc-card,
  .pts-acc-inactive .tn-molecule,
  .pts-acc-inactive .tn-atom,
  .pts-acc-inactive .tn-elem {
    pointer-events: none !important;
    transition: none !important;
    animation: none !important;
  }

  .pts-acc-inactive [data-elem-type="button"] {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* слой поверх всего аккордеона: только он ловит мышь и клики */
  .pts-acc-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    border-radius: 16px;
    cursor: default;
    pointer-events: auto !important;
    background: rgba(33, 34, 40, 0.5);
    -webkit-user-select: none;
    user-select: none;
  }

  .pts-acc-sticker {
    position: absolute;
    z-index: 21;
    width: 250px;
    pointer-events: none !important;
    flex-shrink: 0;
    background-repeat: no-repeat;
    background-position: center;
  }

  /* десктоп: 340×109 → 250×80 */
  .pts-acc-sticker {
    top: 50%;
    right: -10px;
    left: auto;
    bottom: auto;
    height: 80px;
    background-image: url("https://static.tildacdn.com/tild6434-6538-4366-b931-303736653364/Group_2085662084.svg");
    background-size: 250px 80px;
    transform: translateY(-50%);
  }

  /* мобилка: полоса 80px со скруглением; spacer +12px, чтобы зазор был ПОД радиусом */
  @media screen and (max-width: 767px) {
    .pts-acc-spacer {
      display: block;
      height: 92px;
    }

    .pts-acc-round {
      bottom: -80px;
      overflow: hidden;
      border-radius: 12px;
    }

    .pts-acc-round::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80px;
      background-color: #0a0a0c;
      z-index: 0;
      pointer-events: none;
    }

    .pts-acc-card {
      border-bottom-left-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
    }

    .pts-acc-overlay {
      inset: 0;
      border-radius: 12px;
    }

    .pts-acc-sticker {
      top: auto;
      right: auto;
      left: 50%;
      bottom: 16px;
      margin-top: 0;
      height: 44px;
      background-image: url("https://static.tildacdn.com/tild3639-3431-4430-a264-316433346261/Group_2085662084_1.svg");
      background-size: 250px 44px;
      transform: translateX(-50%);
    }
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsAccInactiveInit) return;
  window.__ptsAccInactiveInit = true;

  /* ==================== НАСТРОЙКИ ==================== */

  /*
    Id шапок аккордеона (Zero Block), которые должны быть неактивны.
    Через запятую, с # или без. Классы в Тильде задавать не нужно.

    Примеры на /fast-track:
      rec2914914801 — Разработка Python
      rec2915718001 — Тестирование QA
      rec3084349501 — Кибербезопасность
  */
  var INACTIVE_IDS = 'rec3084349501';

  /* =================================================== */

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function parseIds(str) {
    return String(str || '')
      .split(/[,;\s]+/)
      .map(function (s) { return s.replace(/^#/, '').trim(); })
      .filter(Boolean);
  }

  function findCard(rec) {
    if (!rec) return null;
    return q('.tn-molecule', rec) || q('.t396__artboard', rec) || rec;
  }

  function findHost(card) {
    return card.parentElement || card;
  }

  function stopClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  function ensureUi(rec) {
    var card = findCard(rec);
    if (!card) return;
    var host = findHost(card);

    rec.classList.add('pts-acc-inactive');
    host.classList.add('pts-acc-host');
    card.classList.add('pts-acc-card');

    var round = q('.pts-acc-round', host);
    if (!round) {
      round = document.createElement('div');
      round.className = 'pts-acc-round';
      round.setAttribute('aria-hidden', 'true');
      host.appendChild(round);
    }

    var overlay = q('.pts-acc-overlay', rec);
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'pts-acc-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.addEventListener('click', stopClick, true);
      round.appendChild(overlay);
    } else if (overlay.parentNode !== round) {
      round.appendChild(overlay);
    }

    var sticker = q('.pts-acc-sticker', rec);
    if (!sticker) {
      sticker = document.createElement('div');
      sticker.className = 'pts-acc-sticker';
      sticker.setAttribute('aria-hidden', 'true');
      round.appendChild(sticker);
    } else if (sticker.parentNode !== round) {
      round.appendChild(sticker);
    }

    if (rec.parentNode) {
      var next = rec.nextElementSibling;
      if (!next || !next.classList.contains('pts-acc-spacer')) {
        var spacer = document.createElement('div');
        spacer.className = 'pts-acc-spacer';
        spacer.setAttribute('aria-hidden', 'true');
        rec.parentNode.insertBefore(spacer, rec.nextSibling);
      }
    }

    if (!rec._ptsAccBound) {
      rec._ptsAccBound = true;
      host.addEventListener('click', stopClick, true);
    }
  }

  function init() {
    parseIds(INACTIVE_IDS).forEach(function (id) {
      var rec = document.getElementById(id);
      if (rec) ensureUi(rec);
    });
  }

  function waitAndInit() {
    var ids = parseIds(INACTIVE_IDS);
    if (!ids.length) return;
    var n = 0;
    (function poll() {
      var ready = ids.some(function (id) { return document.getElementById(id); });
      if (ready || n > 30) {
        init();
        return;
      }
      n += 1;
      setTimeout(poll, 100);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
