<!-- ============================================================
     Неактивные аккордеоны направлений (Tilda Zero Block)

     Страница: https://pt-start.ptsecurity.com/fast-track

     Как подключить:
     1. В INACTIVE_IDS ниже перечислите id блоков-шапок аккордеона
        через запятую (с # или без). Классы в Тильде задавать не нужно.
     2. Вставьте весь этот файл в HTML-элемент Тильды
        (в настройки страницы или отдельный HTML-блок ниже аккордеонов).
============================================================ -->

<style>
  .pts-acc-inactive {
    position: relative;
    z-index: 3;
    overflow: visible !important;
    --t396-speedhover: 0s;
    --t396-shadowshoverspeed: 0s;
    --t396-bgcolor-hover-color: var(--t396-bgcolor-color);
    --t396-color-hover-color: var(--t396-color-color);
  }

  .pts-acc-inactive .t396__artboard,
  .pts-acc-inactive .t396__artboard > .tn-group,
  .pts-acc-card {
    overflow: visible !important;
  }

  .pts-acc-inactive .t396__artboard > .tn-group {
    position: relative;
    z-index: 5;
  }

  .pts-acc-inactive .t396__filter {
    pointer-events: none;
  }

  .pts-acc-card {
    position: relative !important;
    cursor: default;
    transition: none !important;
    animation: none !important;
  }

  .pts-acc-inactive .tn-atom,
  .pts-acc-inactive .tn-molecule,
  .pts-acc-card .tn-atom {
    transition: none !important;
    animation: none !important;
  }

  .pts-acc-inactive .tn-atom:hover,
  .pts-acc-inactive .tn-molecule:hover,
  .pts-acc-card:hover,
  .pts-acc-card .tn-atom:hover,
  .pts-acc-card .tn-molecule:hover {
    background-color: var(--t396-bgcolor-color, inherit) !important;
    color: inherit !important;
    border-color: inherit !important;
    box-shadow: none !important;
    transform: none !important;
    filter: none !important;
    animation: none !important;
  }

  .pts-acc-card > *:not(.pts-acc-overlay) {
    pointer-events: none !important;
  }

  .pts-acc-inactive [data-elem-type="button"] {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .pts-acc-overlay {
    position: absolute;
    inset: 0;
    background: rgba(33, 34, 40, 0.5);
    border-radius: inherit;
    z-index: 20;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }

  .pts-acc-sticker {
    position: absolute;
    z-index: 21;
    width: 250px;
    pointer-events: none;
    flex-shrink: 0;
    background-repeat: no-repeat;
    background-position: center;
  }

  /* десктоп: 340×109 → 250×80 */
  .pts-acc-sticker {
    top: 50%;
    right: -10px;
    left: auto;
    bottom: auto;
    height: 80px;
    background-image: url("https://static.tildacdn.com/tild6434-6538-4366-b931-303736653364/Group_2085662084.svg");
    background-size: 250px 80px;
    transform: translateY(-50%);
  }

  /* мобилка: +56px чёрного снизу, стикер по центру в этой полосе */
  @media screen and (max-width: 767px) {
    .pts-acc-inactive {
      margin-bottom: 56px;
    }

    .pts-acc-card {
      border-bottom-left-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
    }

    .pts-acc-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 56px;
      background-color: #0a0a0c;
      border-radius: 0 0 12px 12px;
      pointer-events: none;
      z-index: 19;
    }

    .pts-acc-overlay {
      bottom: -56px;
      border-radius: 12px;
    }

    .pts-acc-sticker {
      top: 100%;
      right: auto;
      left: 50%;
      bottom: auto;
      margin-top: 6px;
      height: 44px;
      background-image: url("https://static.tildacdn.com/tild3639-3431-4430-a264-316433346261/Group_2085662084_1.svg");
      background-size: 250px 44px;
      transform: translateX(-50%);
    }
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsAccInactiveInit) return;
  window.__ptsAccInactiveInit = true;

  /* ==================== НАСТРОЙКИ ==================== */

  /*
    Id шапок аккордеона (Zero Block), которые должны быть неактивны.
    Через запятую, с # или без. Классы в Тильде задавать не нужно.

    Примеры на /fast-track:
      rec2914914801 — Разработка Python
      rec2915718001 — Тестирование QA
      rec3084349501 — Кибербезопасность
  */
  var INACTIVE_IDS = 'rec3084349501';

  /* =================================================== */

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function parseIds(str) {
    return String(str || '')
      .split(/[,;\s]+/)
      .map(function (s) { return s.replace(/^#/, '').trim(); })
      .filter(Boolean);
  }

  function findCard(rec) {
    if (!rec) return null;
    return q('.tn-molecule', rec) || q('.t396__artboard', rec) || rec;
  }

  function stopClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  function ensureUi(rec) {
    var card = findCard(rec);
    if (!card) return;

    rec.classList.add('pts-acc-inactive');
    card.classList.add('pts-acc-card');

    var overlay = q('.pts-acc-overlay', card);
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'pts-acc-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.addEventListener('click', stopClick, true);
      card.appendChild(overlay);
    }

    if (!q('.pts-acc-sticker', card)) {
      var sticker = document.createElement('div');
      sticker.className = 'pts-acc-sticker';
      sticker.setAttribute('aria-hidden', 'true');
      card.appendChild(sticker);
    }

    if (!rec._ptsAccBound) {
      rec._ptsAccBound = true;
      card.addEventListener('click', stopClick, true);
    }
  }

  function init() {
    parseIds(INACTIVE_IDS).forEach(function (id) {
      var rec = document.getElementById(id);
      if (rec) ensureUi(rec);
    });
  }

  function waitAndInit() {
    var ids = parseIds(INACTIVE_IDS);
    if (!ids.length) return;
    var n = 0;
    (function poll() {
      var ready = ids.some(function (id) { return document.getElementById(id); });
      if (ready || n > 30) {
        init();
        return;
      }
      n += 1;
      setTimeout(poll, 100);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
