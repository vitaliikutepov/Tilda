<!-- ============================================================
     Неактивные аккордеоны направлений (Tilda Zero Block)

     Страница: https://pt-start.ptsecurity.com/fast-track

     Как подключить:
     1. В INACTIVE_IDS ниже перечислите id блоков-шапок аккордеона
        через запятую (с # или без). Классы в Тильде задавать не нужно.
     2. Вставьте весь этот файл в HTML-элемент Тильды
        (в настройки страницы или отдельный HTML-блок ниже аккордеонов).
============================================================ -->

<style>
  .pts-acc-inactive {
    position: relative;
    overflow: visible !important;
  }

  .pts-acc-inactive .t396,
  .pts-acc-inactive .t396__artboard,
  .pts-acc-inactive .t396__carrier,
  .pts-acc-inactive .t396__filter,
  .pts-acc-host,
  .pts-acc-card {
    overflow: visible !important;
  }

  .pts-acc-host {
    position: relative !important;
  }

  .pts-acc-inactive .t396__filter {
    pointer-events: none;
  }

  /* фон карточки не трогаем; ховер Тильды не доходит — pointer-events none */
  .pts-acc-card,
  .pts-acc-inactive .tn-molecule,
  .pts-acc-inactive .tn-atom,
  .pts-acc-inactive .tn-elem {
    pointer-events: none !important;
    transition: none !important;
    animation: none !important;
  }

  .pts-acc-inactive [data-elem-type="button"] {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* слой поверх карточки: только он ловит мышь и клики */
  .pts-acc-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    border-radius: 16px;
    cursor: default;
    pointer-events: auto !important;
    background: rgba(33, 34, 40, 0.5);
    -webkit-user-select: none;
    user-select: none;
  }

  .pts-acc-sticker {
    position: absolute;
    z-index: 21;
    width: 250px;
    pointer-events: none !important;
    flex-shrink: 0;
    background-repeat: no-repeat;
    background-position: center;
  }

  /* десктоп: 340×109 → 250×80 */
  .pts-acc-sticker {
    top: 50%;
    right: -10px;
    left: auto;
    bottom: auto;
    height: 80px;
    background-image: url("https://static.tildacdn.com/tild6434-6538-4366-b931-303736653364/Group_2085662084.svg");
    background-size: 250px 80px;
    transform: translateY(-50%);
  }

  /*
    Мобилка: чёрный «хвост» ЖИВЁТ СНАРУЖИ rec (сосед), а не overflow артборда.
    Иначе Тильда обрезает стикер и нижнее скругление.
  */
  .pts-acc-tail {
    display: none;
    position: relative;
    box-sizing: border-box;
    height: 0;
    margin: 0;
    padding: 0;
    border: 0;
    overflow: visible;
    pointer-events: none;
    background: transparent;
  }

  @media screen and (max-width: 767px) {
    .pts-acc-tail {
      display: block;
      height: 56px;
      background-color: #0a0a0c;
      border-radius: 0 0 12px 12px;
      pointer-events: auto;
    }

    .pts-acc-card {
      border-bottom-left-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
    }

    .pts-acc-inactive .pts-acc-overlay {
      border-radius: 12px 12px 0 0;
    }

    .pts-acc-tail .pts-acc-overlay {
      inset: 0;
      border-radius: 0 0 12px 12px;
    }

    .pts-acc-tail .pts-acc-sticker {
      top: 50%;
      right: auto;
      left: 50%;
      bottom: auto;
      margin: 0;
      height: 44px;
      background-image: url("https://static.tildacdn.com/tild3639-3431-4430-a264-316433346261/Group_2085662084_1.svg");
      background-size: 250px 44px;
      transform: translate(-50%, -50%);
    }
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsAccInactiveInit) return;
  window.__ptsAccInactiveInit = true;

  /* ==================== НАСТРОЙКИ ==================== */

  /*
    Id шапок аккордеона (Zero Block), которые должны быть неактивны.
    Через запятую, с # или без. Классы в Тильде задавать не нужно.

    Примеры на /fast-track:
      rec2914914801 — Разработка Python
      rec2915718001 — Тестирование QA
      rec3084349501 — Кибербезопасность
  */
  var INACTIVE_IDS = 'rec3084349501';

  /* =================================================== */

  var tails = [];

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function parseIds(str) {
    return String(str || '')
      .split(/[,;\s]+/)
      .map(function (s) { return s.replace(/^#/, '').trim(); })
      .filter(Boolean);
  }

  function findCard(rec) {
    if (!rec) return null;
    return q('.tn-molecule', rec) || q('.t396__artboard', rec) || rec;
  }

  function findHost(card) {
    return card.parentElement || card;
  }

  function stopClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  function isMobile() {
    return window.matchMedia('(max-width: 767px)').matches;
  }

  function layoutTail(item) {
    var rec = item.rec;
    var host = item.host;
    var tail = item.tail;
    var sticker = item.sticker;

    if (!rec || !host || !tail || !sticker) return;

    if (!isMobile()) {
      tail.style.marginLeft = '';
      tail.style.marginTop = '';
      tail.style.width = '';
      if (sticker.parentNode !== host) host.appendChild(sticker);
      return;
    }

    if (sticker.parentNode !== tail) tail.appendChild(sticker);

    var recRect = rec.getBoundingClientRect();
    var hostRect = host.getBoundingClientRect();
    /* стыкуем хвост к низу карточки (1px нахлёст — без щели), ширина как у карточки */
    tail.style.marginTop = (hostRect.bottom - recRect.bottom - 1) + 'px';
    tail.style.marginLeft = (hostRect.left - recRect.left) + 'px';
    tail.style.width = Math.max(0, hostRect.width) + 'px';
  }

  function layoutAll() {
    tails.forEach(layoutTail);
  }

  function ensureUi(rec) {
    var card = findCard(rec);
    if (!card) return;
    var host = findHost(card);

    rec.classList.add('pts-acc-inactive');
    host.classList.add('pts-acc-host');
    card.classList.add('pts-acc-card');

    var overlay = q('.pts-acc-overlay', host);
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'pts-acc-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.addEventListener('click', stopClick, true);
      host.appendChild(overlay);
    }

    var next = rec.nextElementSibling;
    if (next && next.classList.contains('pts-acc-spacer')) {
      next.parentNode.removeChild(next);
      next = rec.nextElementSibling;
    }

    var tail = next && next.classList.contains('pts-acc-tail') ? next : null;
    if (!tail) {
      tail = document.createElement('div');
      tail.className = 'pts-acc-tail';
      tail.setAttribute('aria-hidden', 'true');
      rec.parentNode.insertBefore(tail, rec.nextSibling);
    }

    var sticker = q('.pts-acc-sticker', rec) || q('.pts-acc-sticker', tail);
    if (!sticker) {
      sticker = document.createElement('div');
      sticker.className = 'pts-acc-sticker';
      sticker.setAttribute('aria-hidden', 'true');
      host.appendChild(sticker);
    }

    var tailOverlay = q('.pts-acc-overlay', tail);
    if (!tailOverlay) {
      tailOverlay = document.createElement('div');
      tailOverlay.className = 'pts-acc-overlay';
      tailOverlay.setAttribute('aria-hidden', 'true');
      tailOverlay.addEventListener('click', stopClick, true);
      tail.appendChild(tailOverlay);
    }

    if (!rec._ptsAccBound) {
      rec._ptsAccBound = true;
      host.addEventListener('click', stopClick, true);
      tail.addEventListener('click', stopClick, true);
    }

    var item = { rec: rec, host: host, tail: tail, sticker: sticker };
    var exists = false;
    for (var i = 0; i < tails.length; i += 1) {
      if (tails[i].rec === rec) {
        tails[i] = item;
        exists = true;
        break;
      }
    }
    if (!exists) tails.push(item);
    layoutTail(item);
  }

  function init() {
    parseIds(INACTIVE_IDS).forEach(function (id) {
      var rec = document.getElementById(id);
      if (rec) ensureUi(rec);
    });
    layoutAll();
    window.requestAnimationFrame(layoutAll);
    setTimeout(layoutAll, 50);
    setTimeout(layoutAll, 250);
  }

  function waitAndInit() {
    var ids = parseIds(INACTIVE_IDS);
    if (!ids.length) return;
    var n = 0;
    (function poll() {
      var ready = ids.some(function (id) { return document.getElementById(id); });
      if (ready || n > 30) {
        init();
        return;
      }
      n += 1;
      setTimeout(poll, 100);
    })();
  }

  window.addEventListener('resize', layoutAll);
  window.addEventListener('orientationchange', layoutAll);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
