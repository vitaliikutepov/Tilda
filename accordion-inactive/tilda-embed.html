<!-- ============================================================
     Неактивные аккордеоны направлений (Tilda Zero Block)

     Страница: https://pt-start.ptsecurity.com/fast-track

     Как подключить:
     1. В INACTIVE_IDS ниже перечислите id блоков-шапок аккордеона
        через запятую (с # или без). Классы в Тильде задавать не нужно.
     2. Вставьте весь этот файл в HTML-элемент Тильды
        (в настройки страницы или отдельный HTML-блок ниже аккордеонов).

     Что делает скрипт для каждого id:
     - перекрывает карточку полупрозрачным #212228 (50%) по всей
       высоте и блокирует клик (аккордеон не раскроется);
     - прячет кнопки плюс/минус (opacity: 0);
     - стикер всегда 250px;
     - до 768px: стикер под текстом, нижний паддинг карточки больше;
     - от 768px: стикер справа, на 10px за правым краем карточки.
============================================================ -->

<style>
  .pts-acc-inactive {
    position: relative;
    z-index: 3;
    overflow: visible !important;
  }

  .pts-acc-inactive .t396__artboard,
  .pts-acc-inactive .t396__artboard > .tn-group,
  .pts-acc-card {
    overflow: visible !important;
  }

  .pts-acc-inactive .t396__artboard > .tn-group {
    position: relative;
    z-index: 5;
  }

  .pts-acc-inactive .t396__filter {
    pointer-events: none;
  }

  .pts-acc-card {
    position: relative !important;
    cursor: default;
  }

  .pts-acc-inactive [data-elem-type="button"] {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .pts-acc-overlay {
    position: absolute;
    inset: 0;
    background: rgba(33, 34, 40, 0.5);
    border-radius: inherit;
    z-index: 20;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }

  /* стикер — div с фоном, чтобы Тильда не прятала его как lazy-img */
  .pts-acc-sticker {
    position: absolute;
    z-index: 21;
    width: 250px;
    height: 44px;
    background-image: url("https://static.tildacdn.com/tild3639-3431-4430-a264-316433346261/Group_2085662084_1.svg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 250px 44px;
    pointer-events: none;
    flex-shrink: 0;
  }

  /* от 768: справа, +10px за край */
  .pts-acc-sticker {
    top: 50%;
    right: -10px;
    left: auto;
    bottom: auto;
    transform: translateY(-50%);
  }

  /* до 768: под текстом, карточка выше за счёт нижнего паддинга */
  @media screen and (max-width: 767px) {
    .pts-acc-inactive {
      padding-bottom: 52px !important;
    }

    .pts-acc-inactive .t396__artboard > .tn-group,
    .pts-acc-card {
      height: auto !important;
      min-height: 100%;
    }

    .pts-acc-card {
      padding-bottom: 68px !important;
    }

    .pts-acc-sticker {
      top: auto;
      right: auto;
      left: 16px;
      bottom: 16px;
      transform: none;
    }
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsAccInactiveInit) return;
  window.__ptsAccInactiveInit = true;

  /* ==================== НАСТРОЙКИ ==================== */

  /*
    Id шапок аккордеона (Zero Block), которые должны быть неактивны.
    Через запятую, с # или без. Классы в Тильде задавать не нужно.

    Примеры на /fast-track:
      rec2914914801 — Разработка Python
      rec2915718001 — Тестирование QA
      rec3084349501 — Кибербезопасность
  */
  var INACTIVE_IDS = 'rec3084349501';

  /* =================================================== */

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function parseIds(str) {
    return String(str || '')
      .split(/[,;\s]+/)
      .map(function (s) { return s.replace(/^#/, '').trim(); })
      .filter(Boolean);
  }

  function findCard(rec) {
    if (!rec) return null;
    return q('.tn-molecule', rec) || q('.t396__artboard', rec) || rec;
  }

  function stopClick(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  function ensureUi(rec) {
    var card = findCard(rec);
    if (!card) return;

    rec.classList.add('pts-acc-inactive');
    card.classList.add('pts-acc-card');

    var overlay = q('.pts-acc-overlay', card);
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'pts-acc-overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.addEventListener('click', stopClick, true);
      card.appendChild(overlay);
    }

    if (!q('.pts-acc-sticker', card)) {
      var sticker = document.createElement('div');
      sticker.className = 'pts-acc-sticker';
      sticker.setAttribute('aria-hidden', 'true');
      card.appendChild(sticker);
    }

    if (!rec._ptsAccBound) {
      rec._ptsAccBound = true;
      card.addEventListener('click', stopClick, true);
    }
  }

  function applyAll() {
    parseIds(INACTIVE_IDS).forEach(function (id) {
      var rec = document.getElementById(id);
      if (rec) ensureUi(rec);
    });
  }

  function watch(rec) {
    if (!rec || rec._ptsAccMo || typeof MutationObserver !== 'function') return;
    rec._ptsAccMo = new MutationObserver(function () {
      if (!q('.pts-acc-overlay', rec) || !q('.pts-acc-sticker', rec)) ensureUi(rec);
    });
    rec._ptsAccMo.observe(rec, { childList: true, subtree: true });
  }

  function init() {
    applyAll();
    parseIds(INACTIVE_IDS).forEach(function (id) {
      watch(document.getElementById(id));
    });
  }

  function waitAndInit() {
    var ids = parseIds(INACTIVE_IDS);
    if (!ids.length) return;
    var n = 0;
    (function poll() {
      var ready = ids.some(function (id) { return document.getElementById(id); });
      if (ready || n > 30) {
        init();
        return;
      }
      n += 1;
      setTimeout(poll, 100);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
