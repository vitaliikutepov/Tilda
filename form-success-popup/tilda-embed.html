<!-- ============================================================
     Кастомный попап успешной отправки формы (Tilda Zero Block)

     Как подключить:
     1. На странице должен быть виджет Nolim «показать зеро-блок
        после успешной отправки» — из него читаются ID формы,
        ID попапа и ссылка закрытия. В этом сниппете ID
        прописывать не нужно.
     2. Весь этот файл вставить в HTML-элемент Тильды (T123).

     Поведение:
     - фон оверлея #DDE3EB / 60% + backdrop-blur 60px;
     - карточка всегда по центру вьюпорта (и после повторной отправки);
     - скролл страницы блокируется, пока попап открыт;
     - клик по фону и кнопки закрытия из Nolim закрывают попап;
     - закрытый попап не перехватывает клики (важно на мобилках).
============================================================ -->

<style>
  /* закрытый попап не должен накрывать страницу: на iOS
     position:fixed внутри display:none всё ещё ловит тапы */
  .pts-success-popup:not(.pts-success-open) {
    display: none !important;
    pointer-events: none !important;
    visibility: hidden !important;
    z-index: -1 !important;
  }

  .pts-success-popup.pts-success-open {
    --zoom: 1 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    visibility: visible !important;
    pointer-events: auto !important;
    position: fixed !important;
    inset: 0 !important;
    left: 0 !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    height: 100dvh !important;
    max-width: 100vw !important;
    max-height: 100dvh !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    overflow: hidden !important;
    z-index: 100005 !important;
    box-sizing: border-box;
    transform: none !important;
  }

  /* оверлей на body: overflow зеро-блока глушит backdrop-filter */
  #pts-success-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100004;
    background-color: rgba(221, 227, 235, 0.6);
    -webkit-backdrop-filter: blur(60px);
    backdrop-filter: blur(60px);
    cursor: pointer;
    touch-action: none;
  }
  #pts-success-backdrop.is-on {
    display: block;
  }

  .pts-success-popup.pts-success-open .t396,
  .pts-success-popup.pts-success-open .t396__artboard {
    --zoom: 1 !important;
    transform: none !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 100% !important;
    max-height: 100% !important;
  }

  .pts-success-popup.pts-success-open .t396 {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    pointer-events: none;
  }

  .pts-success-popup.pts-success-open .t396__artboard {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    margin: 0 !important;
    pointer-events: none;
  }

  .pts-success-popup.pts-success-open .t396__filter,
  .pts-success-popup.pts-success-open .t396__carrier {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    top: 0 !important;
    left: 0 !important;
    cursor: pointer;
    pointer-events: auto;
    z-index: 0 !important;
    background: transparent !important;
  }

  .pts-success-popup.pts-success-open .tn-group {
    pointer-events: auto;
    z-index: 2 !important;
  }

  /* карточка — первый tn-group арта, без привязки к group-id */
  .pts-success-popup.pts-success-open .t396__artboard > .tn-group {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    right: auto !important;
    bottom: auto !important;
    transform: translate(-50%, -50%) !important;
    margin: 0 !important;
    max-width: calc(100vw - 24px);
  }

  html.pts-success-lock,
  html.pts-success-lock body,
  html.pts-success-lock body.t-body,
  html.pts-success-lock body.nolimPopUp,
  html.pts-success-lock body.t-body_scroll-locked,
  html.pts-success-lock body.t-body_success-popup-showed {
    overflow: hidden !important;
    overscroll-behavior: none !important;
  }

  /* body не делаем position:fixed: на iOS это containing block
     для вложенного position:fixed — попап уезжает за экран */

  html.pts-success-lock .t-form-success-popup {
    display: none !important;
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsSuccessPopupInit) return;
  window.__ptsSuccessPopupInit = true;

  var popupId = null;
  var formId = null;
  var closeHref = '#closeallpopup';
  var popup = null;
  var scrollY = 0;
  var locked = false;
  var downOnCard = false;
  var reopenTimer = null;
  var pinTimer = null;
  var allowOpen = false;
  var watched = false;

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function normId(v) {
    if (!v) return '';
    return String(v).replace(/^#/, '').replace(/^\s+|\s+$/g, '');
  }

  function parseSettingsJson(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function settingsFromText(text) {
    if (!text || text.indexOf('zeroBlockId') === -1) return null;
    var m = text.match(/settings(\{[\s\S]*?\})settingsend/);
    if (!m) m = text.match(/(\{[\s\S]*"zeroBlockId"[\s\S]*?\})/);
    if (!m) return null;
    var cfg = parseSettingsJson(m[1]);
    if (!cfg || !cfg.zeroBlockId || !cfg.formBlockId) return null;
    return cfg;
  }

  function readNolimSettings() {
    var it = document.createNodeIterator(document.body, NodeFilter.SHOW_COMMENT);
    var node;
    while ((node = it.nextNode())) {
      var cfg = settingsFromText(node.nodeValue || '');
      if (cfg) return cfg;
    }
    var blocks = document.querySelectorAll('.t123, .t-rec[data-record-type="131"]');
    for (var i = 0; i < blocks.length; i++) {
      var cfg2 = settingsFromText(blocks[i].innerHTML || '');
      if (cfg2) return cfg2;
    }
    return null;
  }

  function applyNolim(cfg) {
    popupId = normId(cfg.zeroBlockId);
    formId = normId(cfg.formBlockId);
    closeHref = cfg.closeBtnLink || '#closeallpopup';
  }

  function popupEl() {
    if (!popupId) return null;
    if (!popup || !popup.isConnected) popup = document.getElementById(popupId);
    return popup;
  }

  function cardEl() {
    var rec = popupEl();
    if (!rec) return null;
    var board = rec.querySelector('.t396__artboard') || rec;
    var kids = board.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].classList && kids[i].classList.contains('tn-group')) return kids[i];
    }
    return rec.querySelector('.tn-group');
  }

  function isOpen() {
    var rec = popupEl();
    return !!(rec && rec.classList.contains('pts-success-open'));
  }

  function ensureBackdrop() {
    var el = document.getElementById('pts-success-backdrop');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'pts-success-backdrop';
    el.setAttribute('aria-hidden', 'true');
    document.body.appendChild(el);
    el.addEventListener('click', function () {
      closePopup();
    });
    return el;
  }

  function showBackdrop() {
    ensureBackdrop().classList.add('is-on');
  }

  function hideBackdrop() {
    var el = document.getElementById('pts-success-backdrop');
    if (el) el.classList.remove('is-on');
  }

  function lockScroll() {
    if (locked) return;
    locked = true;
    scrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add('pts-success-lock');
    document.body.classList.add('pts-success-lock');
    document.body.classList.add('t-body_scroll-locked');
  }

  function unlockScroll() {
    if (!locked) return;
    locked = false;
    document.documentElement.classList.remove('pts-success-lock');
    document.body.classList.remove('pts-success-lock');
    document.body.classList.remove('t-body_scroll-locked');
    document.body.classList.remove('t-body_success-popup-showed');
    document.body.classList.remove('nolimPopUp');
    window.scrollTo(0, scrollY);
  }

  function onTouchMove(e) {
    if (!isOpen()) return;
    var card = cardEl();
    if (card && card.contains(e.target)) return;
    if (e.cancelable) e.preventDefault();
  }

  function hideTildaSuccess() {
    $$('.t-form-success-popup').forEach(function (el) {
      el.style.display = 'none';
    });
    $$('.t702 .t-popup_show, .t1093 .t-popup_show').forEach(function (el) {
      el.style.display = 'none';
    });
  }

  function resetForm() {
    if (!formId) return;
    var rec = document.getElementById(formId);
    if (!rec) return;
    var form = rec.querySelector('form') || rec.querySelector('#form' + formId.replace('rec', ''));
    if (!form) return;
    form.classList.remove('js-send-form-success');
    var box = form.querySelector('.js-successbox');
    if (box) box.style.display = 'none';
    var inputs = form.querySelector('.t-form__inputsbox');
    if (inputs) inputs.classList.remove('t702__inputsbox_hidden');
    var closeBtn = rec.querySelector('.t-popup__close');
    if (closeBtn && typeof closeBtn.click === 'function') closeBtn.click();
  }

  function viewportBox() {
    var iw = window.innerWidth || document.documentElement.clientWidth || 0;
    var ih = window.innerHeight || document.documentElement.clientHeight || 0;
    var box = { top: 0, left: 0, width: iw, height: ih };
    var vv = window.visualViewport;
    /* visualViewport только если это реально окно (клавиатура),
       а не высота всего документа — иначе карточка уезжает вниз */
    if (vv && vv.height > 80 && vv.width > 80 && vv.height <= ih + 2 && vv.width <= iw + 2) {
      box.top = Math.round(vv.offsetTop || 0);
      box.left = Math.round(vv.offsetLeft || 0);
      box.width = Math.round(vv.width);
      box.height = Math.round(vv.height);
    }
    return box;
  }

  function mountPopup(rec) {
    if (!rec) return;
    if (rec.parentNode !== document.body) {
      document.body.appendChild(rec);
    }
  }

  function recenter() {
    var rec = popupEl();
    var card = cardEl();
    if (!rec || !card) return;
    mountPopup(rec);
    rec.style.setProperty('--zoom', '1');
    rec.style.setProperty('display', 'flex', 'important');
    rec.style.setProperty('overflow', 'hidden', 'important');
    rec.style.setProperty('position', 'fixed', 'important');
    rec.style.setProperty('transform', 'none', 'important');
    rec.style.setProperty('visibility', 'visible', 'important');
    rec.style.setProperty('pointer-events', 'auto', 'important');
    rec.style.setProperty('z-index', '100005', 'important');
    rec.style.setProperty('margin', '0px', 'important');
    rec.style.removeProperty('inset');
    var box = viewportBox();
    rec.style.setProperty('top', box.top + 'px', 'important');
    rec.style.setProperty('left', box.left + 'px', 'important');
    rec.style.setProperty('right', 'auto', 'important');
    rec.style.setProperty('bottom', 'auto', 'important');
    rec.style.setProperty('width', box.width + 'px', 'important');
    rec.style.setProperty('height', box.height + 'px', 'important');
    var board = rec.querySelector('.t396__artboard');
    if (board) {
      board.style.setProperty('--zoom', '1');
      board.style.setProperty('transform', 'none', 'important');
      board.style.setProperty('width', box.width + 'px', 'important');
      board.style.setProperty('height', box.height + 'px', 'important');
    }
    card.style.setProperty('position', 'fixed', 'important');
    card.style.setProperty('top', '50%', 'important');
    card.style.setProperty('left', '50%', 'important');
    card.style.setProperty('right', 'auto', 'important');
    card.style.setProperty('bottom', 'auto', 'important');
    card.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
    card.style.setProperty('margin', '0px', 'important');
  }

  function stopPin() {
    if (pinTimer) {
      clearInterval(pinTimer);
      pinTimer = null;
    }
  }

  function startPin() {
    stopPin();
    var n = 0;
    pinTimer = setInterval(function () {
      if (!isOpen() || ++n > 25) {
        stopPin();
        return;
      }
      recenter();
      lockScroll();
    }, 80);
  }

  function requestOpen() {
    allowOpen = true;
    clearTimeout(reopenTimer);
    reopenTimer = setTimeout(openPopup, 30);
  }

  function openPopup() {
    var rec = popupEl();
    if (!rec) return;
    if (document.activeElement && document.activeElement.blur) {
      try { document.activeElement.blur(); } catch (e) {}
    }
    /* выносим на body: transform/--zoom Тильды и body{position:fixed}
       ломают position:fixed на iOS — попап оказывается за экраном */
    mountPopup(rec);
    allowOpen = true;
    rec.classList.add('pts-success-popup');
    rec.classList.add('pts-success-open');
    document.body.classList.add('t-body_success-popup-showed');
    showBackdrop();
    hideTildaSuccess();
    lockScroll();
    recenter();
    startPin();

    if (typeof window.t396_doResize === 'function' && popupId) {
      try { window.t396_doResize(popupId.replace('rec', '')); } catch (e) {}
    }
    requestAnimationFrame(function () {
      recenter();
      lockScroll();
    });
    setTimeout(function () {
      recenter();
      lockScroll();
      hideTildaSuccess();
    }, 50);
  }

  function closePopup() {
    var rec = popupEl();
    allowOpen = false;
    stopPin();
    if (!rec) {
      hideBackdrop();
      unlockScroll();
      return;
    }
    rec.classList.remove('pts-success-open');
    rec.style.display = 'none';
    rec.style.overflow = 'hidden';
    rec.style.visibility = 'hidden';
    rec.style.pointerEvents = 'none';
    hideBackdrop();
    unlockScroll();
    resetForm();
  }

  function onOverlayClick(e) {
    var rec = popupEl();
    if (!rec || !isOpen()) return;
    var closeBtn = e.target.closest && e.target.closest('a[href="' + closeHref + '"]');
    if (closeBtn) {
      e.preventDefault();
      e.stopPropagation();
      closePopup();
      return;
    }
    var card = cardEl();
    if (downOnCard) return;
    if (card && card.contains(e.target)) return;
    closePopup();
  }

  function bindPopup() {
    var rec = popupEl();
    if (!rec || rec.getAttribute('data-pts-success-bound') === '1') return;
    rec.setAttribute('data-pts-success-bound', '1');
    rec.classList.add('pts-success-popup');

    rec.addEventListener('pointerdown', function (e) {
      var card = cardEl();
      downOnCard = !!(card && card.contains(e.target));
    }, true);

    rec.addEventListener('click', onOverlayClick, true);

    rec.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a[href="' + closeHref + '"]')) {
        e.preventDefault();
        e.stopPropagation();
        closePopup();
      }
    });
  }

  function bindForm(form) {
    if (!form || form.getAttribute('data-pts-success-bound') === '1') return;
    form.setAttribute('data-pts-success-bound', '1');
    form.addEventListener('submit', function () {
      allowOpen = true;
    }, true);
    form.addEventListener('tildaform:aftersuccess', function () {
      requestOpen();
    });
    if (window.jQuery && window.jQuery.fn) {
      window.jQuery(form).off('tildaform:aftersuccess.ptsSuccess');
      window.jQuery(form).on('tildaform:aftersuccess.ptsSuccess', function () {
        requestOpen();
      });
    }
  }

  function hookNolimSuccess() {
    if (!formId) return;
    var key = 'NolimSuccessFunction' + formId.replace(/^rec/, '');
    var arr = window[key];
    if (!arr || arr.__ptsHooked) return;
    arr.__ptsHooked = true;
    arr.push(function () {
      requestOpen();
    });
  }

  function scanForms() {
    if (!formId) return;
    var rec = document.getElementById(formId);
    if (!rec) return;
    $$('form, .js-form-proccess', rec).forEach(bindForm);
  }

  function formLooksSent() {
    if (!formId) return false;
    var rec = document.getElementById(formId);
    if (!rec) return false;
    return !!(rec.querySelector('.js-send-form-success') ||
      rec.querySelector('.js-successbox[style*="display: block"]') ||
      rec.querySelector('.js-successbox[style*="display:block"]'));
  }

  function nolimWantsOpen() {
    var rec = popupEl();
    var style = rec ? (rec.getAttribute('style') || '') : '';
    if (document.body.classList.contains('nolimPopUp')) return true;
    if (/display:\s*block/i.test(style) && (allowOpen || formLooksSent())) return true;
    return false;
  }

  function watchNolimShow() {
    var rec = popupEl();
    if (!rec || watched || typeof MutationObserver === 'undefined') return;
    watched = true;
    var obs = new MutationObserver(function () {
      var style = rec.getAttribute('style') || '';
      var isNone = /display:\s*none/i.test(style);
      if (isNone && rec.classList.contains('pts-success-open')) {
        closePopup();
        return;
      }
      if (nolimWantsOpen() && !rec.classList.contains('pts-success-open')) {
        openPopup();
      }
    });
    obs.observe(rec, { attributes: true, attributeFilter: ['style', 'class'] });
    obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  }

  function init() {
    var rec = popupEl();
    if (!rec) return false;
    rec.classList.add('pts-success-popup');
    bindPopup();
    scanForms();
    hookNolimSuccess();
    watchNolimShow();
    return true;
  }

  function waitAndInit() {
    var started = Date.now();
    (function poll() {
      if (!popupId || !formId) {
        var cfg = readNolimSettings();
        if (cfg) applyNolim(cfg);
      }
      if (popupId && formId && init()) return;
      if (Date.now() - started > 20000) return;
      setTimeout(poll, 100);
    })();
  }

  setInterval(function () {
    if (formId) scanForms();
    hookNolimSuccess();
    if (nolimWantsOpen() && !isOpen()) openPopup();
  }, 1000);

  document.addEventListener('tildaform:aftersuccess', function (e) {
    if (!formId) return;
    var rec = document.getElementById(formId);
    if (!rec) return;
    var t = e.target;
    if (t && rec.contains(t.nodeType === 1 ? t : (t.parentElement || document.body))) {
      requestOpen();
    }
  }, true);

  window.addEventListener('resize', function () {
    if (isOpen()) recenter();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      if (isOpen()) recenter();
    });
    window.visualViewport.addEventListener('scroll', function () {
      if (isOpen()) recenter();
    });
  }
  document.addEventListener('touchmove', onTouchMove, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) closePopup();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
