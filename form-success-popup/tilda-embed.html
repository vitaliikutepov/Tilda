<!-- ============================================================
     Кастомный попап успешной отправки формы (Tilda Zero Block)

     Страница: https://positech.id/webinars/secure-applications-ai-era

     Как подключить:
     1. Зеро-блок попапа — #rec3331835203
        (карточка — первая группа .tn-group, кнопки Close → #closeallpopup)
     2. Зеро-блок с формой — #rec3315174201
     3. Виджет Nolim «успех → зеро-блок» можно оставить: сниппет
        перехватывает показ и чинит фон / центр / скролл / клик по фону.
        Если Nolim нет — сниппет сам показывает попап по tildaform:aftersuccess.
     4. Весь этот файл вставить в HTML-элемент Тильды (T123)
        после блока формы или в настройки страницы.

     Поведение:
     - фон оверлея #DDE3EB / 60% + backdrop-blur 60px;
     - карточка всегда по центру вьюпорта (и после повторной отправки);
     - скролл страницы блокируется, пока попап открыт;
     - клик по фону и кнопки #closeallpopup закрывают попап.
============================================================ -->

<style>
  #rec3331835203 {
    display: none;
    position: fixed !important;
    inset: 0 !important;
    left: 0 !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 100005 !important;
    margin: 0 !important;
    padding: 0 !important;
    background-color: rgba(221, 227, 235, 0.6) !important;
    -webkit-backdrop-filter: blur(60px);
    backdrop-filter: blur(60px);
    overflow: hidden !important;
    box-sizing: border-box;
  }

  #rec3331835203.pts-success-open,
  #rec3331835203[style*="display: block"],
  #rec3331835203[style*="display:block"] {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
  }

  #rec3331835203 .t396 {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    pointer-events: none;
  }

  #rec3331835203 .t396__artboard {
    position: relative !important;
    width: 100% !important;
    top: auto !important;
    left: auto !important;
    margin: 0 !important;
    pointer-events: none;
  }

  /* фильтр растягиваем на весь экран — это кликабельный фон */
  #rec3331835203 .t396__filter,
  #rec3331835203 .t396__carrier {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    top: 0 !important;
    left: 0 !important;
    cursor: pointer;
    pointer-events: auto;
    z-index: 0 !important;
    background: transparent !important;
  }

  #rec3331835203 .tn-group {
    pointer-events: auto;
    z-index: 2 !important;
  }

  /* карточка: сбрасываем top/left Тильды, центрируем относительно арта */
  #rec3331835203 .tn-group[data-group-id="1775812703037000001"] {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    right: auto !important;
    bottom: auto !important;
    transform: translate(-50%, -50%) !important;
    margin: 0 !important;
  }

  html.pts-success-lock,
  html.pts-success-lock body,
  html.pts-success-lock body.t-body,
  html.pts-success-lock body.nolimPopUp,
  html.pts-success-lock body.t-body_scroll-locked,
  html.pts-success-lock body.t-body_success-popup-showed {
    overflow: hidden !important;
    overscroll-behavior: none !important;
    touch-action: none;
  }

  body.pts-success-lock {
    position: fixed !important;
    width: 100% !important;
    left: 0 !important;
    right: 0 !important;
  }

  html.pts-success-lock .t-form-success-popup {
    display: none !important;
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptsSuccessPopupInit) return;
  window.__ptsSuccessPopupInit = true;

  /* ==================== НАСТРОЙКИ ==================== */

  var POPUP_ID = 'rec3331835203';
  var FORM_ID = 'rec3315174201';
  var CARD_GROUP = '1775812703037000001';
  var CLOSE_HREF = '#closeallpopup';

  /* =================================================== */

  var popup = null;
  var scrollY = 0;
  var locked = false;
  var downOnCard = false;
  var reopenTimer = null;

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function popupEl() {
    if (!popup || !popup.isConnected) popup = document.getElementById(POPUP_ID);
    return popup;
  }

  function cardEl() {
    var rec = popupEl();
    if (!rec) return null;
    return rec.querySelector('.tn-group[data-group-id="' + CARD_GROUP + '"]') ||
      rec.querySelector('.t396__artboard > .tn-group');
  }

  function isOpen() {
    var rec = popupEl();
    return !!(rec && rec.classList.contains('pts-success-open'));
  }

  function lockScroll() {
    if (locked) return;
    locked = true;
    scrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add('pts-success-lock');
    document.body.classList.add('pts-success-lock');
    document.body.style.top = '-' + scrollY + 'px';
    document.body.classList.remove('nolimPopUp');
    document.body.classList.add('t-body_scroll-locked');
  }

  function unlockScroll() {
    if (!locked) return;
    locked = false;
    document.documentElement.classList.remove('pts-success-lock');
    document.body.classList.remove('pts-success-lock');
    document.body.classList.remove('t-body_scroll-locked');
    document.body.classList.remove('t-body_success-popup-showed');
    document.body.classList.remove('nolimPopUp');
    document.body.style.top = '';
    window.scrollTo(0, scrollY);
  }

  function hideTildaSuccess() {
    $$('.t-form-success-popup').forEach(function (el) {
      el.style.display = 'none';
    });
    $$('.t702 .t-popup_show, .t1093 .t-popup_show').forEach(function (el) {
      el.style.display = 'none';
    });
  }

  function resetForm() {
    var rec = document.getElementById(FORM_ID);
    if (!rec) return;
    var form = rec.querySelector('form') || rec.querySelector('#form' + FORM_ID.replace('rec', ''));
    if (!form) return;
    form.classList.remove('js-send-form-success');
    var box = form.querySelector('.js-successbox');
    if (box) box.style.display = 'none';
    var inputs = form.querySelector('.t-form__inputsbox');
    if (inputs) inputs.classList.remove('t702__inputsbox_hidden');
    var closeBtn = rec.querySelector('.t-popup__close');
    if (closeBtn && typeof closeBtn.click === 'function') closeBtn.click();
  }

  function recenter() {
    var rec = popupEl();
    var card = cardEl();
    if (!rec || !card) return;
    rec.style.setProperty('display', 'flex', 'important');
    rec.style.setProperty('overflow', 'hidden', 'important');
    rec.style.setProperty('position', 'fixed', 'important');
    rec.style.setProperty('inset', '0px', 'important');
    rec.style.setProperty('top', '0px', 'important');
    rec.style.setProperty('left', '0px', 'important');
    rec.style.setProperty('right', '0px', 'important');
    rec.style.setProperty('bottom', '0px', 'important');
    card.style.setProperty('position', 'absolute', 'important');
    card.style.setProperty('top', '50%', 'important');
    card.style.setProperty('left', '50%', 'important');
    card.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
    card.style.setProperty('margin', '0px', 'important');
  }

  function openPopup() {
    var rec = popupEl();
    if (!rec) return;
    rec.classList.add('pts-success-open');
    document.body.classList.add('t-body_success-popup-showed');
    hideTildaSuccess();
    lockScroll();
    recenter();

    if (typeof window.t396_doResize === 'function') {
      try { window.t396_doResize(POPUP_ID.replace('rec', '')); } catch (e) {}
    }
    /* Тильда пересчитывает координаты после resize — возвращаем центр */
    requestAnimationFrame(function () {
      recenter();
      lockScroll();
    });
    setTimeout(function () {
      recenter();
      lockScroll();
      hideTildaSuccess();
    }, 50);
    setTimeout(function () {
      recenter();
      lockScroll();
    }, 200);
  }

  function closePopup() {
    var rec = popupEl();
    if (!rec) return;
    rec.classList.remove('pts-success-open');
    rec.style.display = 'none';
    rec.style.overflow = 'hidden';
    unlockScroll();
    resetForm();
  }

  function onOverlayClick(e) {
    var rec = popupEl();
    if (!rec || !isOpen()) return;
    var closeBtn = e.target.closest && e.target.closest('a[href="' + CLOSE_HREF + '"]');
    if (closeBtn) {
      e.preventDefault();
      e.stopPropagation();
      closePopup();
      return;
    }
    var card = cardEl();
    if (downOnCard) return;
    if (card && card.contains(e.target)) return;
    closePopup();
  }

  function bindPopup() {
    var rec = popupEl();
    if (!rec || rec.getAttribute('data-pts-success-bound') === '1') return;
    rec.setAttribute('data-pts-success-bound', '1');

    rec.addEventListener('pointerdown', function (e) {
      var card = cardEl();
      downOnCard = !!(card && card.contains(e.target));
    }, true);

    rec.addEventListener('click', onOverlayClick, true);

    rec.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a[href="' + CLOSE_HREF + '"]')) {
        e.preventDefault();
        e.stopPropagation();
        closePopup();
      }
    });
  }

  function bindForm(form) {
    if (!form || form.getAttribute('data-pts-success-bound') === '1') return;
    form.setAttribute('data-pts-success-bound', '1');
    form.addEventListener('tildaform:aftersuccess', function () {
      clearTimeout(reopenTimer);
      reopenTimer = setTimeout(openPopup, 30);
    });
  }

  function scanForms() {
    var rec = document.getElementById(FORM_ID);
    if (!rec) return;
    $$('form, .js-form-proccess', rec).forEach(bindForm);
  }

  function watchNolimShow() {
    var rec = popupEl();
    if (!rec || typeof MutationObserver === 'undefined') return;
    var obs = new MutationObserver(function () {
      var shown = rec.classList.contains('pts-success-open') ||
        /display:\s*block/i.test(rec.getAttribute('style') || '');
      if (shown && !rec.classList.contains('pts-success-open')) {
        openPopup();
      }
      if (rec.classList.contains('pts-success-open')) {
        lockScroll();
        recenter();
      }
    });
    obs.observe(rec, { attributes: true, attributeFilter: ['style', 'class'] });
  }

  function init() {
    popup = document.getElementById(POPUP_ID);
    if (!popup) return;
    bindPopup();
    scanForms();
    watchNolimShow();

    setInterval(scanForms, 1000);

    window.addEventListener('resize', function () {
      if (isOpen()) recenter();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) closePopup();
    });
  }

  function waitAndInit() {
    var started = Date.now();
    (function poll() {
      if (document.getElementById(POPUP_ID) || Date.now() - started > 4000) {
        init();
        return;
      }
      if (Date.now() - started < 20000) setTimeout(poll, 100);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
