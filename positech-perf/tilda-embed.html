<!-- ============================================================
     Ускорение загрузки positech.id (Tilda)

     Куда вставлять:
     Настройки страницы → Дополнительно → HTML-код в HEAD.
     Если HEAD недоступен — HTML-блок T123 самым первым на странице
     (эффект слабее: браузер сначала парсит ~4 МБ HTML).

     Что делает сниппет:
     - сразу показывает контент (Тильда на первом визите прячет
       .t-records {opacity:0} до DOMContentLoaded + 400 мс);
     - не даёт hero/globe-видео качать mp4, пока они не в вьюпорте;
     - ставит loading=lazy картинкам ниже первого экрана.
     Сниппет не уменьшает сам HTML (~4 МБ) и не убирает 8 копий
     jQuery/Owl — это правки в редакторе, см. README.
============================================================ -->

<style>
  /* Тильда на первом визите (desktop ≥980px) красит страницу
     в opacity:0, пока не отработает inline-скрипт в конце head.
     Пока парсится 4 МБ HTML, пользователь видит пустой экран. */
  .t-records,
  .t-records.t-records_animated {
    opacity: 1 !important;
    transition: none !important;
  }
</style>

<script>
(function () {
  'use strict';
  if (window.__ptsPerfInit) return;
  window.__ptsPerfInit = true;

  var DROPBOX = 'dropboxusercontent.com';
  var GLOBE = '/vide6235-3031-4534-a364-356533396431/globe.mp4';
  var ALLOWED = '__ptsAllowPlay';
  var origPlay = HTMLMediaElement.prototype.play;
  var srcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
  var watched = [];
  var io = null;

  function isHeavyUrl(u) {
    u = (u || '').toString();
    return u.indexOf(DROPBOX) !== -1 || u.indexOf(GLOBE) !== -1;
  }

  function mediaUrl(el) {
    return (el.__ptsDeferredSrc || el.currentSrc || el.src ||
      (el.getAttribute && el.getAttribute('src')) ||
      (el.getAttribute && el.getAttribute('data-src')) || '').toString();
  }

  function isHeavyVideo(el) {
    if (isHeavyUrl(mediaUrl(el))) return true;
    var wrap = el.closest && el.closest('[data-mp4video]');
    return !!(wrap && isHeavyUrl(wrap.getAttribute('data-mp4video')));
  }

  function inView(el) {
    var r = el.getBoundingClientRect();
    var vh = window.innerHeight || 800;
    return r.bottom > -80 && r.top < vh + 80;
  }

  function setSrc(el, v) {
    if (srcDesc && srcDesc.set) srcDesc.set.call(el, v);
    else el.setAttribute('src', v);
  }

  function arm(el) {
    if (el[ALLOWED]) return;
    el.preload = 'none';
    el.autoplay = false;
    try { el.removeAttribute('autoplay'); } catch (e) {}
    if (typeof el.pause === 'function' && !el.paused) {
      try { el.pause(); } catch (e2) {}
    }
  }

  function watch(el) {
    if (!el || el.__ptsWatched) return;
    el.__ptsWatched = true;
    watched.push(el);
    arm(el);
    if (io) io.observe(el);
  }

  function allowAndPlay(el) {
    el[ALLOWED] = true;
    if (el.__ptsDeferredSrc) {
      setSrc(el, el.__ptsDeferredSrc);
      el.__ptsDeferredSrc = '';
    } else if (!el.getAttribute('src') && el.dataset && el.dataset.src) {
      setSrc(el, el.dataset.src);
    }
    el.muted = true;
    el.playsInline = true;
    el.setAttribute('playsinline', '');
    el.setAttribute('muted', '');
    origPlay.call(el).catch(function () {});
  }

  function scanVideos(root) {
    var list = (root || document).querySelectorAll('video');
    for (var i = 0; i < list.length; i++) {
      if (isHeavyVideo(list[i])) watch(list[i]);
    }
    var holders = (root || document).querySelectorAll('[data-mp4video]');
    for (var j = 0; j < holders.length; j++) {
      var src = holders[j].getAttribute('data-mp4video') || '';
      if (!isHeavyUrl(src)) continue;
      var v = holders[j].querySelector('video');
      if (v) watch(v);
    }
  }

  function tick() {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (var i = 0; i < watched.length; i++) {
      var el = watched[i];
      if (reduced) {
        if (!el.paused) try { el.pause(); } catch (e0) {}
        continue;
      }
      if (inView(el)) {
        if (!el[ALLOWED]) allowAndPlay(el);
        else if (el.paused) origPlay.call(el).catch(function () {});
      } else if (!el.paused) {
        try { el.pause(); } catch (e1) {}
      }
    }
  }

  HTMLMediaElement.prototype.play = function () {
    if (this[ALLOWED] || !isHeavyVideo(this)) {
      return origPlay.apply(this, arguments);
    }
    arm(this);
    watch(this);
    if (inView(this) && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      allowAndPlay(this);
      return origPlay.apply(this, arguments);
    }
    return Promise.resolve();
  };

  if (srcDesc && srcDesc.set) {
    Object.defineProperty(HTMLMediaElement.prototype, 'src', {
      configurable: true,
      enumerable: !!srcDesc.enumerable,
      get: srcDesc.get,
      set: function (v) {
        if (!this[ALLOWED] && isHeavyUrl(v)) {
          this.__ptsDeferredSrc = v;
          this.preload = 'none';
          this.autoplay = false;
          watch(this);
          return;
        }
        srcDesc.set.call(this, v);
      }
    });
  }

  function lazyImages() {
    var imgs = document.querySelectorAll('img');
    var fold = (window.innerHeight || 800) + 100;
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      if (img.loading === 'lazy') continue;
      var top = img.getBoundingClientRect().top;
      if (top > fold) {
        img.loading = 'lazy';
        img.decoding = 'async';
      }
    }
  }

  function unhide() {
    var recs = document.querySelectorAll('.t-records');
    for (var i = 0; i < recs.length; i++) {
      recs[i].classList.add('t-records_animated', 't-records_visible');
      recs[i].style.opacity = '1';
    }
    try { sessionStorage.setItem('visited', 'y'); } catch (e) {}
  }

  function start() {
    unhide();
    scanVideos(document);
    lazyImages();
    tick();
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(function () { tick(); }, {
        rootMargin: '80px 0px',
        threshold: 0.01
      });
      for (var i = 0; i < watched.length; i++) io.observe(watched[i]);
      var mo = new MutationObserver(function (muts) {
        for (var m = 0; m < muts.length; m++) {
          var nodes = muts[m].addedNodes;
          for (var n = 0; n < nodes.length; n++) {
            if (nodes[n].nodeType !== 1) continue;
            if (nodes[n].tagName === 'VIDEO' && isHeavyVideo(nodes[n])) watch(nodes[n]);
            else scanVideos(nodes[n]);
          }
        }
        tick();
      });
      mo.observe(document.documentElement, { childList: true, subtree: true });
    } else {
      window.addEventListener('scroll', tick, { passive: true });
      setInterval(function () { scanVideos(document); tick(); }, 500);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
  setTimeout(unhide, 0);
})();
</script>
