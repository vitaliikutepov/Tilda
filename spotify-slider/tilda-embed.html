<!-- ============================================================
     Слайдер в духе lifeatspotify.com для Tilda Zero Block

     1. Контейнер: Shape с классом  slider
     2. Слайды 1…5:
          .cardN      — активная (контентная) сторона
          .cardN-img  — оборотная (картинка)
     3. Пагинация: .cslide4-N  содержит полоску  .slide4-N  (N=1…5)
     4. Курсоры = фиолетовая кнопка (.slider-prev/.slider-next) + белая стрелка; оригиналы скрыты
     5. Размер/радиус слайда = заготовка Zero Block на каждом вьюпорте (1920→520×460 / 1366→429×380 / 1024→482×380 / 768→354×354 / 320→280×240)

     Поведение: coverflow 3D, flip активной карточки, цикл, swipe, автоплей.
============================================================ -->

<style>
  .r.t-rec.pt-card-source {
    position: absolute !important;
    top: -100000px !important;
    left: 0 !important;
    width: 100% !important;
    height: 0 !important;
    overflow: hidden !important;
    visibility: hidden !important;
    pointer-events: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* оригиналы стрелок — скрыты, но остаются в DOM для курсора */
  .slider-prev,
  .slider-next {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  .slider,
  .slider .tn-atom {
    overflow: visible !important;
  }

  .pt-stage {
    position: absolute;
    inset: 0;
    /* размеры/радиус = заготовки Zero Block (1920 / 1366 / 1024 / 768 / 320) */
    --pt-w: 520px;
    --pt-h: 460px;
    --pt-radius: 40px;
    --pt-gap: 16px;
    /* без scale — размер = заготовка, глубину даёт rotateY + translateZ */
    --pt-side-scale: 1;
    --pt-far-scale: 1;
    --pt-rotate-1: 42deg;
    --pt-rotate-2: 58deg;
    --pt-depth-1: -110px;
    --pt-depth-2: -200px;
    --pt-dur: 700ms;
    --pt-flip-dur: 0.6s;
    --pt-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --pt-offset-1: calc(var(--pt-w) * 0.5 + var(--pt-gap) + var(--pt-w) * 0.5);
    --pt-offset-2: calc(var(--pt-offset-1) + var(--pt-w) * 0.5 + var(--pt-gap) + var(--pt-w) * 0.5);
    --pt-cur-prev: w-resize;
    --pt-cur-next: e-resize;
    perspective: 1200px;
    perspective-origin: 50% 50%;
    transform-style: preserve-3d;
    pointer-events: auto;
  }

  .pt-stage:not(.pt-ready) { opacity: 0; }
  .pt-stage.pt-ready {
    opacity: 1;
    transition: opacity 0.35s ease;
  }

  .pt-slide {
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    width: var(--pt-w) !important;
    height: var(--pt-h) !important;
    margin: 0 !important;
    transform: translate3d(-50%, -50%, 0);
    transform-origin: center center;
    transform-style: preserve-3d;
    z-index: 1;
    pointer-events: auto;
    will-change: transform;
    transition: transform var(--pt-dur) var(--pt-ease);
    user-select: none;
    -webkit-user-select: none;
  }

  .pt-stage:not(.pt-ready) .pt-slide { transition: none !important; }
  .pt-slide.pt-dragging,
  .pt-slide.pt-no-trans { transition: none !important; }

  /* --- flip (как у Spotify) --- */
  .pt-flip {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: var(--pt-radius);
    transform-style: preserve-3d;
    transition: transform var(--pt-flip-dur) var(--pt-ease);
  }

  .pt-slide.is-flipped .pt-flip {
    transform: rotateY(180deg);
  }

  .pt-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: var(--pt-radius);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    /* flat — иначе при coverflow rotateY родителя просвечивает вторая сторона */
    transform-style: flat;
    overflow: hidden;
    display: block;
  }

  .pt-face-front {
    transform: rotateY(0deg);
  }

  .pt-face-back {
    transform: rotateY(180deg);
  }

  /*
   * Неактивные слайды в coverflow: parent rotateY ломает backface-visibility,
   * поэтому контентную сторону прячем явно — видна только фотка.
   */
  .pt-slide:not(.is-active) .pt-flip {
    transform: none !important;
    transition: none !important;
  }

  .pt-slide:not(.is-active) .pt-face-back {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .pt-slide:not(.is-active) .pt-face-front {
    visibility: visible !important;
    opacity: 1 !important;
    transform: none !important;
  }

  /* на боковых слайдах — только фото, без подписей с image-face */
  .pt-slide:not(.is-active) .pt-face-front .tn-elem[data-elem-type="text"],
  .pt-slide:not(.is-active) .pt-face-front .tn-elem[data-elem-type="text"] .tn-atom {
    opacity: 0 !important;
    visibility: hidden !important;
  }

  /* группа = ровно размер слайда (= заготовка на текущем вьюпорте) */
  .pt-face > .tn-group,
  .pt-face > .t396__group {
    position: relative !important;
    left: auto !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    transform: none !important;
    border-radius: var(--pt-radius) !important;
  }

  .pt-face > .tn-group > .tn-molecule,
  .pt-face > .t396__group > .tn-molecule,
  .pt-face > .tn-group > [id^="molecule-"],
  .pt-face > .t396__group > [id^="molecule-"] {
    width: 100% !important;
    height: 100% !important;
    box-sizing: border-box !important;
    border-radius: var(--pt-radius) !important;
  }

  /* убираем opacity:0 / анимации Тильды внутри карточки — текст сразу полный */
  .pt-face .tn-group,
  .pt-face .t396__group,
  .pt-face .tn-molecule,
  .pt-face [id^="molecule-"],
  .pt-face .tn-elem,
  .pt-face .tn-atom {
    opacity: 1 !important;
  }

  /* coverflow-позиции — без прозрачности */
  .pt-slide.is-active {
    z-index: 5;
    transform: translate3d(-50%, -50%, 0) rotateY(0deg) scale(1);
  }

  .pt-slide.is-prev {
    z-index: 3;
    transform:
      translate3d(calc(-50% - var(--pt-offset-1)), -50%, var(--pt-depth-1))
      rotateY(var(--pt-rotate-1))
      scale(var(--pt-side-scale));
  }

  .pt-slide.is-next {
    z-index: 3;
    transform:
      translate3d(calc(-50% + var(--pt-offset-1)), -50%, var(--pt-depth-1))
      rotateY(calc(var(--pt-rotate-1) * -1))
      scale(var(--pt-side-scale));
  }

  .pt-slide.is-prev-2 {
    z-index: 2;
    transform:
      translate3d(calc(-50% - var(--pt-offset-2)), -50%, var(--pt-depth-2))
      rotateY(var(--pt-rotate-2))
      scale(var(--pt-far-scale));
  }

  .pt-slide.is-next-2 {
    z-index: 2;
    transform:
      translate3d(calc(-50% + var(--pt-offset-2)), -50%, var(--pt-depth-2))
      rotateY(calc(var(--pt-rotate-2) * -1))
      scale(var(--pt-far-scale));
  }

  .pt-slide.is-hid-l {
    z-index: 1;
    pointer-events: none;
    transform:
      translate3d(calc(-50% - var(--pt-offset-2) - var(--pt-w) * 0.5), -50%, -260px)
      rotateY(70deg)
      scale(var(--pt-far-scale));
  }

  .pt-slide.is-hid-r {
    z-index: 1;
    pointer-events: none;
    transform:
      translate3d(calc(-50% + var(--pt-offset-2) + var(--pt-w) * 0.5), -50%, -260px)
      rotateY(-70deg)
      scale(var(--pt-far-scale));
  }

  /* пагинация: трек/неактивный и заливка = #EFE8FB, концы 4px */
  .cslide4-1,
  .cslide4-2,
  .cslide4-3,
  .cslide4-4,
  .cslide4-5 {
    cursor: pointer;
    overflow: hidden !important;
    border-radius: 4px !important;
    background-color: #EFE8FB !important;
  }

  .slide4-1,
  .slide4-2,
  .slide4-3,
  .slide4-4,
  .slide4-5 {
    opacity: 1 !important;
    border-radius: 4px !important;
    overflow: hidden !important;
    position: relative !important;
  }

  .slide4-1 .tn-atom,
  .slide4-2 .tn-atom,
  .slide4-3 .tn-atom,
  .slide4-4 .tn-atom,
  .slide4-5 .tn-atom {
    background-color: #EFE8FB !important;
    background-image: none !important;
    border-radius: 4px !important;
    transform: none !important;
    transform-origin: left center !important;
  }

  /* неактивный: полная полоска #EFE8FB */
  .cslide4-1:not(.is-on) .slide4-1 .tn-atom,
  .cslide4-2:not(.is-on) .slide4-2 .tn-atom,
  .cslide4-3:not(.is-on) .slide4-3 .tn-atom,
  .cslide4-4:not(.is-on) .slide4-4 .tn-atom,
  .cslide4-5:not(.is-on) .slide4-5 .tn-atom {
    width: 100% !important;
    animation: none !important;
  }

  /* активный: трек бледнее, заливка растёт по ширине (скругление 4px сохраняется) */
  .cslide4-1.is-on,
  .cslide4-2.is-on,
  .cslide4-3.is-on,
  .cslide4-4.is-on,
  .cslide4-5.is-on {
    background-color: rgba(239, 232, 251, 0.35) !important;
  }

  .cslide4-1.is-on .slide4-1.pt-pag-run .tn-atom,
  .cslide4-2.is-on .slide4-2.pt-pag-run .tn-atom,
  .cslide4-3.is-on .slide4-3.pt-pag-run .tn-atom,
  .cslide4-4.is-on .slide4-4.pt-pag-run .tn-atom,
  .cslide4-5.is-on .slide4-5.pt-pag-run .tn-atom {
    animation: pt-pag-fill var(--pt-autoplay, 5s) linear forwards;
  }

  @keyframes pt-pag-fill {
    from { width: 0% !important; }
    to { width: 100% !important; }
  }

  .pt-stage.pt-cursor-prev,
  .pt-stage.pt-cursor-prev .pt-slide {
    cursor: var(--pt-cur-prev) !important;
  }
  .pt-stage.pt-cursor-next,
  .pt-stage.pt-cursor-next .pt-slide {
    cursor: var(--pt-cur-next) !important;
  }
  .pt-stage.is-grabbing,
  .pt-stage.is-grabbing .pt-slide {
    cursor: grabbing !important;
  }

  /* брейкпоинты = screens Zero Block: 1920 / 1366 / 1024 / 768 / 320 */
  @media screen and (max-width: 1919px) {
    .pt-stage {
      --pt-w: 429px;
      --pt-h: 380px;
      --pt-radius: 40px;
      perspective: 1100px;
    }
  }

  @media screen and (max-width: 1365px) {
    .pt-stage {
      --pt-w: 482px;
      --pt-h: 380px;
      --pt-radius: 32px;
      --pt-rotate-1: 38deg;
      --pt-rotate-2: 52deg;
      perspective: 1000px;
    }
  }

  @media screen and (max-width: 1023px) {
    .pt-stage {
      --pt-w: 354px;
      --pt-h: 354px;
      --pt-radius: 32px;
      --pt-rotate-1: 32deg;
      --pt-rotate-2: 46deg;
      --pt-depth-1: -80px;
      --pt-depth-2: -150px;
      perspective: 900px;
    }
  }

  @media screen and (max-width: 767px) {
    .pt-stage {
      --pt-w: 280px;
      --pt-h: 240px;
      --pt-radius: 24px;
      --pt-rotate-1: 26deg;
      --pt-rotate-2: 40deg;
      perspective: 700px;
    }
  }
</style>

<script>
(function () {
  'use strict';

  if (window.__ptSpotifySliderV6) return;
  window.__ptSpotifySliderV6 = true;

  var AUTOPLAY_MS = 5000;
  var SWIPE_THRESHOLD = 60;
  var SLIDE_COUNT = 5;
  var POS_CLASSES = [
    'is-active', 'is-prev', 'is-next', 'is-prev-2', 'is-next-2', 'is-hid-l', 'is-hid-r'
  ];

  var active = 0;
  var slides = [];
  var stage = null;
  var animating = false;
  var autoplayTimer = null;
  var drag = null;
  var suppressClick = false;
  var pagItems = [];

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function qa(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function findRec(el) {
    if (!el) return null;
    if (el.closest) return el.closest('.r.t-rec');
    var p = el.parentElement;
    while (p && !(p.classList && p.classList.contains('t-rec'))) p = p.parentElement;
    return p;
  }

  function hideSourceRec(el) {
    var rec = findRec(el);
    if (rec) rec.classList.add('pt-card-source');
  }

  /* копируем scoped CSS Тильды (#rec… → .pt-scope-rec…) */
  function attachScopedStyles(el, wrap) {
    var rec = findRec(el);
    if (!rec || !rec.id) return;
    var scope = 'pt-scope-' + rec.id;
    wrap.classList.add(scope);
    if (document.querySelector('style[data-pt-from="' + rec.id + '"]')) return;
    var chunks = [];
    qa('style', rec).forEach(function (st) {
      if (st.textContent) chunks.push(st.textContent);
    });
    if (!chunks.length) return;
    var s = document.createElement('style');
    s.setAttribute('data-pt-from', rec.id);
    s.textContent = chunks.join('\n').split('#' + rec.id).join('.' + scope);
    document.head.appendChild(s);
  }

  function mountFace(faceEl, sourceEl) {
    if (!sourceEl) return;
    hideSourceRec(sourceEl);
    attachScopedStyles(sourceEl, faceEl);
    faceEl.appendChild(sourceEl);
  }

  function relPos(i) {
    var n = slides.length;
    return (i - active + n) % n;
  }

  function classForRel(rel) {
    var n = slides.length;
    if (rel === 0) return 'is-active';
    var half = Math.floor(n / 2);
    if (rel <= half) return rel === 1 ? 'is-next' : 'is-next-' + rel;
    var fromEnd = n - rel;
    return fromEnd === 1 ? 'is-prev' : 'is-prev-' + fromEnd;
  }

  function isRightRel(rel, n) {
    return rel >= 1 && rel <= Math.floor(n / 2);
  }

  function isLeftRel(rel, n) {
    return rel > Math.floor(n / 2);
  }

  function clearPos(slide) {
    for (var i = 0; i < POS_CLASSES.length; i++) slide.classList.remove(POS_CLASSES[i]);
  }

  function applyPositions(opts) {
    opts = opts || {};
    var n = slides.length;
    var prevActive = typeof opts.from === 'number' ? opts.from : null;
    var dir = opts.dir || 0;

    for (var i = 0; i < n; i++) {
      var slide = slides[i];
      var rel = relPos(i);
      var cls = classForRel(rel);

      if (prevActive !== null && dir !== 0) {
        var oldRel = (i - prevActive + n) % n;
        var jumping =
          (isLeftRel(oldRel, n) && isRightRel(rel, n)) ||
          (isRightRel(oldRel, n) && isLeftRel(rel, n));
        if (jumping) {
          slide.classList.add('pt-no-trans');
          clearPos(slide);
          slide.classList.add(dir > 0 ? 'is-hid-r' : 'is-hid-l');
          void slide.offsetWidth;
          slide.classList.remove('pt-no-trans', 'is-hid-l', 'is-hid-r');
        }
      }

      clearPos(slide);
      slide.classList.add(cls);
      /* активная — перевёрнута на контентную сторону (.cardN) */
      slide.classList.toggle('is-flipped', rel === 0);
    }

    syncPagination();
  }

  function syncPagination() {
    for (var i = 0; i < pagItems.length; i++) {
      var item = pagItems[i];
      if (!item || !item.wrap) continue;
      var on = i === active;
      item.wrap.classList.toggle('is-on', on);
      if (item.bar) {
        item.bar.classList.remove('pt-pag-run');
        var atom = item.bar.querySelector('.tn-atom') || item.bar;
        atom.style.animation = 'none';
        void atom.offsetWidth;
        atom.style.animation = '';
        if (on) item.bar.classList.add('pt-pag-run');
      }
    }
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
    for (var i = 0; i < pagItems.length; i++) {
      var item = pagItems[i];
      if (item && item.bar) item.bar.classList.remove('pt-pag-run');
    }
  }

  function startAutoplay() {
    stopAutoplay();
    if (pagItems[active] && pagItems[active].bar) {
      var bar = pagItems[active].bar;
      var atom = bar.querySelector('.tn-atom') || bar;
      atom.style.animation = 'none';
      void atom.offsetWidth;
      atom.style.animation = '';
      bar.classList.add('pt-pag-run');
    }
    autoplayTimer = setInterval(function () {
      if (!drag) go(1);
    }, AUTOPLAY_MS);
  }

  function go(dir) {
    if (animating || !slides.length) return;
    animating = true;
    var from = active;
    var n = slides.length;
    active = (active + dir + n) % n;
    applyPositions({ from: from, dir: dir });
    window.setTimeout(function () { animating = false; }, 720);
  }

  function goTo(index) {
    if (index === active || animating || index < 0 || index >= slides.length) return;
    var n = slides.length;
    var forward = (index - active + n) % n;
    var backward = (active - index + n) % n;
    var dir = forward <= backward ? 1 : -1;
    var steps = Math.min(forward, backward);
    if (steps <= 1) {
      go(dir);
      return;
    }
    /* несколько шагов подряд */
    var left = steps;
    function step() {
      if (left <= 0) return;
      go(dir);
      left--;
      if (left > 0) setTimeout(step, 740);
    }
    step();
  }

  function sideFromEvent(e) {
    if (!stage) return 1;
    var rect = stage.getBoundingClientRect();
    var x = e.clientX != null ? e.clientX :
      (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    return x < rect.left + rect.width / 2 ? -1 : 1;
  }

  function setCursorSide(e) {
    if (!stage || drag) return;
    var dir = sideFromEvent(e);
    stage.classList.toggle('pt-cursor-prev', dir < 0);
    stage.classList.toggle('pt-cursor-next', dir > 0);
  }

  function onPointerDown(e) {
    if (animating) return;
    var point = e.touches ? e.touches[0] : e;
    drag = { x0: point.clientX, y0: point.clientY, dx: 0, locked: null, moved: false };
    suppressClick = false;
    stopAutoplay();
    if (stage) stage.classList.add('is-grabbing');
    slides.forEach(function (s) { s.classList.add('pt-dragging'); });
  }

  function dragTransform(slide, shift) {
    var t = shift;
    if (slide.classList.contains('is-active')) {
      return 'translate3d(calc(-50% + ' + t + 'px), -50%, 0) rotateY(0deg) scale(1)';
    }
    if (slide.classList.contains('is-prev')) {
      return 'translate3d(calc(-50% - var(--pt-offset-1) + ' + (t * 0.55) + 'px), -50%, var(--pt-depth-1)) rotateY(var(--pt-rotate-1)) scale(var(--pt-side-scale))';
    }
    if (slide.classList.contains('is-next')) {
      return 'translate3d(calc(-50% + var(--pt-offset-1) + ' + (t * 0.55) + 'px), -50%, var(--pt-depth-1)) rotateY(calc(var(--pt-rotate-1) * -1)) scale(var(--pt-side-scale))';
    }
    if (slide.classList.contains('is-prev-2')) {
      return 'translate3d(calc(-50% - var(--pt-offset-2) + ' + (t * 0.35) + 'px), -50%, var(--pt-depth-2)) rotateY(var(--pt-rotate-2)) scale(var(--pt-far-scale))';
    }
    if (slide.classList.contains('is-next-2')) {
      return 'translate3d(calc(-50% + var(--pt-offset-2) + ' + (t * 0.35) + 'px), -50%, var(--pt-depth-2)) rotateY(calc(var(--pt-rotate-2) * -1)) scale(var(--pt-far-scale))';
    }
    return '';
  }

  function onPointerMove(e) {
    if (!drag) {
      setCursorSide(e);
      return;
    }
    var point = e.touches ? e.touches[0] : e;
    var dx = point.clientX - drag.x0;
    var dy = point.clientY - drag.y0;

    if (drag.locked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      drag.locked = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
    }
    if (drag.locked === 'y') return;
    if (drag.locked === 'x' && e.cancelable) e.preventDefault();

    drag.dx = dx;
    drag.moved = Math.abs(dx) > 8;
    if (drag.moved) suppressClick = true;

    var w = stage ? parseFloat(getComputedStyle(stage).getPropertyValue('--pt-w')) || 520 : 520;
    var shift = Math.max(-w * 0.55, Math.min(w * 0.55, dx));
    slides.forEach(function (slide) {
      var t = dragTransform(slide, shift);
      if (t) slide.style.transform = t;
    });
  }

  function clearDragStyles() {
    slides.forEach(function (s) {
      s.classList.remove('pt-dragging');
      s.style.transform = '';
    });
    if (stage) stage.classList.remove('is-grabbing');
  }

  function onPointerUp(e) {
    if (!drag) return;
    var dx = drag.dx;
    var locked = drag.locked;
    drag = null;
    clearDragStyles();

    if (locked === 'x' && Math.abs(dx) >= SWIPE_THRESHOLD) {
      suppressClick = true;
      go(dx < 0 ? 1 : -1);
    }
    if (e && e.type && e.type.indexOf('touch') === -1) setCursorSide(e);
    startAutoplay();
  }

  function onStageClick(e) {
    if (suppressClick) { suppressClick = false; return; }
    if (animating) return;
    go(sideFromEvent(e));
  }

  /* курсор = фиолетовая кнопка Тильды (#8742ee, radius 42) + белая стрелка */
  var CURSOR_BG = '#8742ee';

  function buttonBgColor(btn) {
    var atom = (btn && btn.querySelector('.tn-atom')) || btn;
    if (!atom) return CURSOR_BG;
    var cs = getComputedStyle(atom);
    var v = (cs.getPropertyValue('--t396-bgcolor-color') || '').trim();
    if (v && v !== 'transparent' && v !== 'none' && v.indexOf('rgba(0, 0, 0, 0)') === -1) return v;
    var bg = cs.backgroundColor;
    if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') return bg;
    return CURSOR_BG;
  }

  var ARROW_PREV =

  function roundRectPath(ctx, x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function cursorSizeForViewport() {
    return window.matchMedia('(max-width: 767px)').matches ? 32 : 56;
  }

  function composeButtonCursor(sel, cssVar, fallback, isNext) {
    if (!stage) return;
    var btn = q(sel);
    var bg = buttonBgColor(btn) || CURSOR_BG;
    var size = cursorSizeForViewport();
    var hot = Math.round(size / 2);
    /* как у кнопки Тильды: padding 16 при 56 → иконка 24; radius 42 */
    var pad = Math.round(size * (16 / 56));
    var radius = Math.round(size * (42 / 56));
    var d = isNext ? ARROW_NEXT : ARROW_PREV;

    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = bg;
    roundRectPath(ctx, 0, 0, size, size, radius);
    ctx.fill();

    ctx.save();
    ctx.translate(pad, pad);
    ctx.scale((size - pad * 2) / 24, (size - pad * 2) / 24);
    ctx.fillStyle = '#ffffff';
    try {
      ctx.fill(new Path2D(d));
    } catch (err) {
      ctx.beginPath();
      if (isNext) {
        ctx.moveTo(8, 5); ctx.lineTo(16, 12); ctx.lineTo(8, 19); ctx.closePath();
      } else {
        ctx.moveTo(16, 5); ctx.lineTo(8, 12); ctx.lineTo(16, 19); ctx.closePath();
      }
      ctx.fill();
    }
    ctx.restore();

    var url = canvas.toDataURL('image/png');
    stage.style.setProperty(cssVar, 'url("' + url + '") ' + hot + ' ' + hot + ', ' + fallback);
  }

  function applyCursorsFromButtons() {
    var prev = q('.slider-prev');
    var next = q('.slider-next');
    var restore = [];
    [prev, next].forEach(function (el) {
      if (!el) return;
      restore.push({
        el: el,
        opacity: el.style.getPropertyValue('opacity'),
        visibility: el.style.getPropertyValue('visibility'),
        display: el.style.getPropertyValue('display')
      });
      el.style.setProperty('opacity', '1', 'important');
      el.style.setProperty('visibility', 'visible', 'important');
      el.style.setProperty('display', 'block', 'important');
    });

    composeButtonCursor('.slider-prev', '--pt-cur-prev', 'w-resize', false);
    composeButtonCursor('.slider-next', '--pt-cur-next', 'e-resize', true);

    restore.forEach(function (r) {
      if (r.opacity) r.el.style.setProperty('opacity', r.opacity);
      else r.el.style.removeProperty('opacity');
      if (r.visibility) r.el.style.setProperty('visibility', r.visibility);
      else r.el.style.removeProperty('visibility');
      if (r.display) r.el.style.setProperty('display', r.display);
      else r.el.style.removeProperty('display');
    });
  }

  /* размеры слайда жёстко по брейкпоинтам Тильды (не из offset — он может схлопнуться) */
  function tildaSlideMetrics() {
    var w = window.innerWidth || document.documentElement.clientWidth || 1920;
    if (w <= 767) return { w: 280, h: 240, r: 24 };
    if (w <= 1023) return { w: 354, h: 354, r: 32 };
    if (w <= 1365) return { w: 482, h: 380, r: 32 };
    if (w <= 1919) return { w: 429, h: 380, r: 40 };
    return { w: 520, h: 460, r: 40 };
  }

  function syncSlideSizeFromCards() {
    if (!stage) return;
    var m = tildaSlideMetrics();
    stage.style.setProperty('--pt-w', m.w + 'px');
    stage.style.setProperty('--pt-h', m.h + 'px');
    stage.style.setProperty('--pt-radius', m.r + 'px');
  }

  function bindPagination() {
    pagItems = [];
    for (var n = 1; n <= SLIDE_COUNT; n++) {
      var wrap = q('.cslide4-' + n);
      var bar = q('.slide4-' + n);
      pagItems.push({ wrap: wrap, bar: bar });
      if (!wrap) continue;
      (function (idx) {
        wrap.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          stopAutoplay();
          goTo(idx);
          startAutoplay();
        });
      })(n - 1);
    }
    if (stage) {
      stage.style.setProperty('--pt-autoplay', (AUTOPLAY_MS / 1000) + 's');
    }
  }

  function bindInteractions() {
    if (!stage) return;
    stage.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    stage.addEventListener('touchstart', onPointerDown, { passive: true });
    stage.addEventListener('touchmove', onPointerMove, { passive: false });
    stage.addEventListener('touchend', onPointerUp);
    stage.addEventListener('touchcancel', onPointerUp);
    stage.addEventListener('mousemove', setCursorSide);
    stage.addEventListener('click', onStageClick);
    stage.addEventListener('mouseleave', function () {
      stage.classList.remove('pt-cursor-prev', 'pt-cursor-next');
      if (!drag) startAutoplay();
    });
    stage.addEventListener('mouseenter', stopAutoplay);
  }

  function buildSlide(n) {
    var content = q('.card' + n);
    var image = q('.card' + n + '-img');
    if (!content && !image) return null;

    var slide = document.createElement('div');
    slide.className = 'pt-slide';
    slide.setAttribute('data-pt-index', String(n - 1));

    var flip = document.createElement('div');
    flip.className = 'pt-flip';

    /* фронт = оборотная картинка; бэк = контент (активная сторона) */
    var faceFront = document.createElement('div');
    faceFront.className = 'pt-face pt-face-front';
    var faceBack = document.createElement('div');
    faceBack.className = 'pt-face pt-face-back';

    if (image) mountFace(faceFront, image);
    if (content) mountFace(faceBack, content);

    /* если картинки нет — на фронте тоже контент (без пустого слайда) */
    if (!image && content) {
      var cloneWrap = document.createElement('div');
      cloneWrap.style.cssText = 'width:100%;height:100%;';
      cloneWrap.innerHTML = content.innerHTML;
      faceFront.appendChild(cloneWrap);
    }

    flip.appendChild(faceFront);
    flip.appendChild(faceBack);
    slide.appendChild(flip);
    return slide;
  }

  function build() {
    var frame = q('.slider');
    if (!frame) return;

    var host = frame.querySelector('.tn-atom') || frame;
    if (!host.style.position) host.style.position = 'relative';
    host.style.width = '100%';
    host.style.height = '100%';

    stage = document.createElement('div');
    stage.className = 'pt-stage';
    host.appendChild(stage);

    for (var n = 1; n <= SLIDE_COUNT; n++) {
      var slide = buildSlide(n);
      if (!slide) continue;
      stage.appendChild(slide);
      slides.push(slide);
    }

    if (slides.length < 2) return;

    applyCursorsFromButtons();
    bindPagination();
    applyPositions();
    bindInteractions();

    syncSlideSizeFromCards();
    window.addEventListener('resize', function () {
      syncSlideSizeFromCards();
      applyCursorsFromButtons();
    });

    requestAnimationFrame(function () {
      syncSlideSizeFromCards();
      stage.classList.add('pt-ready');
      startAutoplay();
    });
  }

  function boot() {
    if (document.querySelector('.pt-stage')) return;
    build();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(boot, 350);
    });
  } else {
    setTimeout(boot, 350);
  }

  setTimeout(function () {
    if (!document.querySelector('.pt-stage')) boot();
  }, 1400);
})();
