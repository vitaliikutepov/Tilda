<!-- ============================================================
     Слайдер в духе lifeatspotify.com (первый экран) для Tilda

     Как подключить:
     1. В зеро-блоке добавьте Shape и дайте ему класс  slider
        — слайдер построится внутри него.
     2. Карточки-источники — группы/элементы с классами
          .card1  .card2  .card3
        (каждая 520×460, внутри: заголовок + подзаголовок).
        Блоки с карточками после инициализации скрываются.
     3. Вставьте этот файл целиком в HTML-элемент Тильды
        (или в «HTML-код страницы» перед </body>).

     Поведение:
     - активная карточка по центру, слева и справа — соседние;
     - зациклено (3 слайда);
     - у неактивных виден только заголовок, подзаголовок —
       у активного (плавно);
     - без переворота (flip) как на референсе;
     - свайп/drag, клик по боковой карточке, автоплей.
============================================================ -->

<style>
  /* прячем блоки-источники карточек после переноса */
  .r.t-rec.pt-card-source {
    position: absolute !important;
    top: -100000px !important;
    left: 0 !important;
    width: 100% !important;
    height: 0 !important;
    overflow: hidden !important;
    visibility: hidden !important;
    pointer-events: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .slider,
  .slider .tn-atom {
    overflow: visible !important;
  }

  .pt-stage {
    position: absolute;
    inset: 0;
    --pt-w: 520px;
    --pt-h: 460px;
    --pt-gap: 28px;
    --pt-side-scale: 0.88;
    --pt-dur: 700ms;
    --pt-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    pointer-events: none;
  }

  .pt-stage:not(.pt-ready) {
    opacity: 0;
  }
  .pt-stage.pt-ready {
    opacity: 1;
    transition: opacity 0.35s ease;
  }

  .pt-slide {
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    width: var(--pt-w) !important;
    height: var(--pt-h) !important;
    margin: 0 !important;
    /* центрируем через translate в позиционных классах */
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 1;
    pointer-events: auto;
    cursor: grab;
    will-change: transform, opacity, filter;
    transition:
      transform var(--pt-dur) var(--pt-ease),
      opacity var(--pt-dur) var(--pt-ease),
      filter var(--pt-dur) var(--pt-ease);
    user-select: none;
    -webkit-user-select: none;
  }

  .pt-stage:not(.pt-ready) .pt-slide {
    transition: none !important;
  }

  .pt-slide.pt-dragging,
  .pt-slide.pt-no-trans {
    transition: none !important;
  }

  .pt-slide.is-active {
    z-index: 5;
    cursor: default;
    opacity: 1;
    filter: none;
    transform: translate(-50%, -50%) scale(1);
  }

  .pt-slide.is-prev {
    z-index: 3;
    opacity: 0.72;
    filter: brightness(0.92);
    transform:
      translate(
        calc(-50% - var(--pt-w) * 0.5 - var(--pt-gap) - var(--pt-w) * var(--pt-side-scale) * 0.5),
        -50%
      )
      scale(var(--pt-side-scale));
  }

  .pt-slide.is-next {
    z-index: 3;
    opacity: 0.72;
    filter: brightness(0.92);
    transform:
      translate(
        calc(-50% + var(--pt-w) * 0.5 + var(--pt-gap) + var(--pt-w) * var(--pt-side-scale) * 0.5),
        -50%
      )
      scale(var(--pt-side-scale));
  }

  /* «за кадром» — для мгновенного прыжка left↔right без проезда через центр */
  .pt-slide.is-hid-l {
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transform:
      translate(
        calc(-50% - var(--pt-w) * 1.35 - var(--pt-gap) * 2),
        -50%
      )
      scale(var(--pt-side-scale));
  }

  .pt-slide.is-hid-r {
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transform:
      translate(
        calc(-50% + var(--pt-w) * 1.35 + var(--pt-gap) * 2),
        -50%
      )
      scale(var(--pt-side-scale));
  }

  /* внутри карточки — сброс абсолютных координат Тильды */
  .pt-slide.tn-group,
  .pt-slide.t396__group {
    position: absolute !important;
  }

  .pt-slide .tn-molecule {
    width: 100% !important;
    height: 100% !important;
    box-sizing: border-box;
  }

  /* подзаголовок: только у активного */
  .pt-slide .pt-slide-sub {
    opacity: 0 !important;
    max-height: 0 !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    pointer-events: none;
    transition:
      opacity 0.45s ease,
      max-height 0.45s ease,
      margin 0.45s ease;
  }

  .pt-slide.is-active .pt-slide-sub {
    opacity: 1 !important;
    max-height: 160px !important;
    pointer-events: auto;
  }

  .pt-stage.is-grabbing,
  .pt-stage.is-grabbing .pt-slide {
    cursor: grabbing !important;
  }

  @media (max-width: 959px) {
    .pt-stage {
      --pt-w: 400px;
      --pt-h: 354px;
      --pt-gap: 16px;
      --pt-side-scale: 0.82;
    }
  }

  @media (max-width: 639px) {
    .pt-stage {
      --pt-w: 280px;
      --pt-h: 248px;
      --pt-gap: 10px;
      --pt-side-scale: 0.78;
    }
  }
</style>

<script>
(function () {
  'use strict';

  var AUTOPLAY_MS = 5000;
  var SWIPE_THRESHOLD = 60;
  var CARD_SELECTOR = '.card1, .card2, .card3';

  var active = 0;
  var slides = [];
  var stage = null;
  var animating = false;
  var autoplayTimer = null;
  var drag = null;

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function qa(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function hideSourceRec(el) {
    var rec = el.closest ? el.closest('.r.t-rec') : null;
    if (!rec) {
      var p = el.parentElement;
      while (p && !(p.classList && p.classList.contains('t-rec'))) p = p.parentElement;
      rec = p;
    }
    if (rec) rec.classList.add('pt-card-source');
  }

  function markSubtitle(card) {
    var texts = qa('.tn-elem[data-elem-type="text"], .t396__elem[data-elem-type="text"]', card);
    if (texts.length < 2) {
      texts = qa('.tn-elem, .t396__elem', card).filter(function (el) {
        return el.getAttribute('data-elem-type') === 'text' ||
          (el.querySelector && el.querySelector('.tn-atom') &&
            el.querySelector('.tn-atom').textContent.trim());
      });
    }
    if (texts.length >= 2) {
      texts[1].classList.add('pt-slide-sub');
    } else if (texts.length === 1) {
      /* fallback: второй ребёнок молекулы */
      var mol = q('.tn-molecule', card) || card;
      var kids = Array.prototype.filter.call(mol.children, function (n) {
        return n.nodeType === 1;
      });
      if (kids[1]) kids[1].classList.add('pt-slide-sub');
    }
  }

  function relPos(i) {
    var n = slides.length;
    return (i - active + n) % n;
  }

  /* для 3 слайдов: 0 center, 1 next, 2 prev */
  function classForRel(rel) {
    if (rel === 0) return 'is-active';
    if (rel === 1) return 'is-next';
    return 'is-prev';
  }

  function applyPositions(opts) {
    opts = opts || {};
    var n = slides.length;
    var prevActive = typeof opts.from === 'number' ? opts.from : null;
    var dir = opts.dir || 0; /* +1 next, -1 prev */

    for (var i = 0; i < n; i++) {
      var slide = slides[i];
      var rel = relPos(i);
      var cls = classForRel(rel);

      /* прыжок через центр: left→right при next, right→left при prev */
      var jumping = false;
      if (prevActive !== null && n === 3) {
        var oldRel = (i - prevActive + n) % n;
        if (dir > 0 && oldRel === 2 && rel === 1) jumping = true;
        if (dir < 0 && oldRel === 1 && rel === 2) jumping = true;
      }

      if (jumping) {
        slide.classList.add('pt-no-trans');
        /* сначала уводим за кадр в сторону движения */
        slide.classList.remove('is-active', 'is-prev', 'is-next', 'is-hid-l', 'is-hid-r');
        slide.classList.add(dir > 0 ? 'is-hid-r' : 'is-hid-l');
        void slide.offsetWidth;
        slide.classList.remove('pt-no-trans', 'is-hid-l', 'is-hid-r');
      }

      slide.classList.remove('is-active', 'is-prev', 'is-next', 'is-hid-l', 'is-hid-r');
      slide.classList.add(cls);
    }
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
  }

  function startAutoplay() {
    stopAutoplay();
    autoplayTimer = setInterval(function () {
      if (!drag) go(1);
    }, AUTOPLAY_MS);
  }

  function go(dir) {
    if (animating || !slides.length) return;
    animating = true;
    var from = active;
    var n = slides.length;
    active = (active + dir + n) % n;
    applyPositions({ from: from, dir: dir });
    window.setTimeout(function () {
      animating = false;
    }, 720);
  }

  function goTo(index) {
    if (index === active || animating) return;
    var n = slides.length;
    var forward = (index - active + n) % n;
    var backward = (active - index + n) % n;
    go(forward <= backward ? 1 : -1);
  }

  /* --- drag / swipe --- */
  function onPointerDown(e) {
    if (animating) return;
    var point = e.touches ? e.touches[0] : e;
    drag = {
      x0: point.clientX,
      y0: point.clientY,
      dx: 0,
      locked: null,
      moved: false
    };
    stopAutoplay();
    if (stage) stage.classList.add('is-grabbing');
    slides.forEach(function (s) { s.classList.add('pt-dragging'); });
  }

  function onPointerMove(e) {
    if (!drag) return;
    var point = e.touches ? e.touches[0] : e;
    var dx = point.clientX - drag.x0;
    var dy = point.clientY - drag.y0;

    if (drag.locked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      drag.locked = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
    }
    if (drag.locked === 'y') return;
    if (drag.locked === 'x' && e.cancelable) e.preventDefault();

    drag.dx = dx;
    drag.moved = Math.abs(dx) > 8;

    var w = stage ? parseFloat(getComputedStyle(stage).getPropertyValue('--pt-w')) || 520 : 520;
    var shift = Math.max(-w * 0.55, Math.min(w * 0.55, dx));

    slides.forEach(function (slide) {
      var base = '';
      if (slide.classList.contains('is-active')) {
        base = 'translate(calc(-50% + ' + shift + 'px), -50%) scale(1)';
      } else if (slide.classList.contains('is-prev')) {
        base =
          'translate(calc(-50% - var(--pt-w) * 0.5 - var(--pt-gap) - var(--pt-w) * var(--pt-side-scale) * 0.5 + ' +
          shift * 0.55 + 'px), -50%) scale(var(--pt-side-scale))';
      } else if (slide.classList.contains('is-next')) {
        base =
          'translate(calc(-50% + var(--pt-w) * 0.5 + var(--pt-gap) + var(--pt-w) * var(--pt-side-scale) * 0.5 + ' +
          shift * 0.55 + 'px), -50%) scale(var(--pt-side-scale))';
      }
      if (base) slide.style.transform = base;
    });
  }

  function clearDragStyles() {
    slides.forEach(function (s) {
      s.classList.remove('pt-dragging');
      s.style.transform = '';
    });
    if (stage) stage.classList.remove('is-grabbing');
  }

  function onPointerUp() {
    if (!drag) return;
    var dx = drag.dx;
    var moved = drag.moved;
    var locked = drag.locked;
    drag = null;
    clearDragStyles();

    if (locked === 'x' && Math.abs(dx) >= SWIPE_THRESHOLD) {
      go(dx < 0 ? 1 : -1);
    }
    startAutoplay();
    return moved;
  }

  function bindDrag() {
    if (!stage) return;

    stage.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stage.addEventListener('touchstart', onPointerDown, { passive: true });
    stage.addEventListener('touchmove', onPointerMove, { passive: false });
    stage.addEventListener('touchend', onPointerUp);
    stage.addEventListener('touchcancel', onPointerUp);
  }

  function build() {
    var frame = q('.slider');
    if (!frame) return;

    var cards = qa(CARD_SELECTOR).filter(function (el, idx, arr) {
      /* уникальные узлы в порядке документа */
      return arr.indexOf(el) === idx && !el.closest('.pt-stage');
    });

    if (cards.length < 2) return;

    var host = frame.querySelector('.tn-atom') || frame;
    host.style.position = host.style.position || 'relative';
    host.style.width = '100%';
    host.style.height = '100%';

    stage = document.createElement('div');
    stage.className = 'pt-stage';
    host.appendChild(stage);

    cards.forEach(function (card, i) {
      hideSourceRec(card);
      markSubtitle(card);
      card.classList.add('pt-slide');
      card.addEventListener('click', function (e) {
        if (card.__ptIgnoreClick) {
          card.__ptIgnoreClick = false;
          return;
        }
        var rel = relPos(i);
        if (rel === 1) go(1);
        else if (rel === cards.length - 1 || (cards.length === 3 && rel === 2)) go(-1);
      });
      stage.appendChild(card);
      slides.push(card);
    });

    /* клик после драга не должен переключать */
    stage.addEventListener('click', function (e) {
      /* handled per-card; noop */
    }, true);

    var downX = 0;
    stage.addEventListener('pointerdown', function (e) {
      downX = e.clientX;
    });
    stage.addEventListener('pointerup', function (e) {
      if (Math.abs(e.clientX - downX) > 10) {
        var t = e.target.closest('.pt-slide');
        if (t) t.__ptIgnoreClick = true;
      }
    });

    applyPositions();
    bindDrag();

    requestAnimationFrame(function () {
      stage.classList.add('pt-ready');
      startAutoplay();
    });

    stage.addEventListener('mouseenter', stopAutoplay);
    stage.addEventListener('mouseleave', function () {
      if (!drag) startAutoplay();
    });
  }

  function boot() {
    if (document.querySelector('.pt-stage')) return;
    build();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      /* Тильда дорисовывает zero-block чуть позже */
      setTimeout(boot, 300);
    });
  } else {
    setTimeout(boot, 300);
  }

  /* повторная попытка, если карточки появились позже */
  setTimeout(function () {
    if (!document.querySelector('.pt-stage')) boot();
  }, 1200);
})();
</script>
