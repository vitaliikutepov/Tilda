<!-- ============================================================
     Стек warning-карточек для Tilda Zero Block
     Страница: https://form.ptsecurity.com/h1bg-special
     Блок:     #rec3354439901

     Как подключить:
     1. В зеро-блоке уже есть группы .warningcard-1 … .warningcard-4
        и тексты описаний + группа с кнопкой «Оставить заявку».
     2. Вставьте ВЕСЬ этот файл в HTML-элемент страницы
        (настройки страницы / T123 / HTML в этом же зеро-блоке).
     3. Опубликуйте. В редакторе Тильда HTML не рисует.

     Поведение:
     - по умолчанию все карточки закрыты (видна только шапка);
     - стек — flex-автолейаут: открытие верхней сдвигает нижние вниз;
     - ≥1366px — раскрытие по ховеру;
     - <1366px — аккордеон по тапу (одна открытая карточка);
     - на мобилке зум как у Тильды (280px сетки 320 → ~380px на телефоне);
     - четвёртая карточка выше (309px), фейд заливки и обводки;
     - оверлап 14px; ховер 0.8s ease-in-out;
     - стиль: rgba(255,0,0,.1) + stroke 1px rgba(255,0,0,.1)
       + backdrop-blur 150px, радиус 16 / 12.
============================================================ -->

<style>

  #rec3354439901 [data-elem-id="1787822370860000008"],
  #rec3354439901 [data-elem-id="1787822403649000015"],

  /* Стек: на десктопе — лесенка 700px, ниже 1366 — колонка заготовки (поля 20px) */
  #rec3354439901 .ocs-stack {

      top: 120px;
      left: calc(50% - 683px + 646px);

    }
  }
  @media screen and (max-width: 1365px) {
    #rec3354439901 .ocs-stack {
      top: 346px;

    width: 700px;

    min-width: 0;
    margin: 0;
    box-sizing: border-box;
    border-radius: var(--ocs-radius);
    border: 1px solid var(--ocs-red);
    background: var(--ocs-red);
    -webkit-backdrop-filter: blur(150px);

  #rec3354439901 .ocs-card:nth-child(1) { width: 580px; z-index: 1; }
  #rec3354439901 .ocs-card:nth-child(2) { width: 620px; z-index: 2; }
  #rec3354439901 .ocs-card:nth-child(3) { width: 660px; z-index: 3; }
  #rec3354439901 .ocs-card:nth-child(4),
  #rec3354439901 .ocs-card--fade {

    mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 180px), transparent 100%);

  @media screen and (max-width: 1365px) {
    #rec3354439901 .ocs-card,
    #rec3354439901 .ocs-card:nth-child(1),
    #rec3354439901 .ocs-card:nth-child(2),
    #rec3354439901 .ocs-card:nth-child(3),
    #rec3354439901 .ocs-card:nth-child(4) {

  #rec3354439901 .ocs-card + .ocs-card {

  #rec3354439901 .ocs-stack .warningcard-1,
  #rec3354439901 .ocs-stack .warningcard-2,
  #rec3354439901 .ocs-stack .warningcard-3,
  #rec3354439901 .ocs-stack .warningcard-4,
  #rec3354439901 .ocs-stack .tn-group,
  #rec3354439901 .ocs-stack .tn-molecule {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    bottom: auto !important;
    right: auto !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    height: auto !important;

    box-sizing: border-box !important;
  }
  #rec3354439901 .ocs-stack .ocs-cta {
    position: absolute !important;
    left: 50% !important;
    right: auto !important;
    bottom: 0 !important;
    top: auto !important;
    transform: translateX(-50%) !important;
    width: 276px !important;

  @media screen and (max-width: 1365px) {
    #rec3354439901 .ocs-stack .ocs-cta {
      width: 80% !important;
    }
  }
  @media screen and (max-width: 767px) {
    #rec3354439901 .ocs-stack .ocs-cta {
      width: 100% !important;

  }

  #rec3354439901 .ocs-card .tn-molecule {
    height: auto !important;
    background: transparent !important;
    background-image: none !important;
    border: 0 !important;
    box-shadow: none !important;
    overflow: visible !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  #rec3354439901 .ocs-card .tn-molecule .tn-atom,
  #rec3354439901 .ocs-card .title {
    min-width: 0;
    max-width: 100%;
    white-space: normal !important;
  }

  #rec3354439901 .ocs-reveal {
    display: block;
    max-height: 0 !important;
    overflow: hidden !important;
    opacity: 0;
    transition: max-height var(--ocs-time) var(--ocs-ease), opacity var(--ocs-time) var(--ocs-ease);
  }
  #rec3354439901 .ocs-reveal-inner {
    overflow: hidden !important;
    min-height: 0 !important;
    min-width: 0 !important;
  }

  /* Открытое состояние: описание снова в потоке карточки */
  #rec3354439901 .ocs-card.is-open .ocs-reveal { opacity: 1; }
  #rec3354439901 .ocs-card.is-open .ocs-reveal,
  #rec3354439901 .ocs-card.is-open .ocs-body,
  #rec3354439901 .ocs-card.is-open .ocs-body .tn-atom {
    max-height: 400px !important;
    height: auto !important;
    opacity: 1 !important;
    visibility: visible !important;
    overflow: visible !important;

  }
  #rec3354439901 .ocs-card.is-open .ocs-body {
    padding: 0 20px 20px !important;
    display: block !important;
  }
  #rec3354439901 .ocs-card.is-open + .ocs-card {
    margin-top: -4px;
  }

  @media screen and (min-width: 1366px) {
    #rec3354439901 .ocs-card:hover .ocs-reveal { opacity: 1; }
    #rec3354439901 .ocs-card:hover .ocs-reveal,
    #rec3354439901 .ocs-card:hover .ocs-body,
    #rec3354439901 .ocs-card:hover .ocs-body .tn-atom {
      max-height: 400px !important;
      height: auto !important;
      opacity: 1 !important;
      visibility: visible !important;
      overflow: visible !important;
      pointer-events: auto !important;
    }
    #rec3354439901 .ocs-card:hover .ocs-body {
      padding: 0 20px 20px !important;
      display: block !important;
    }
    #rec3354439901 .ocs-card:hover + .ocs-card {

    }

  @media screen and (max-width: 767px) {
    #rec3354439901 .ocs-card.is-open .ocs-body {
      padding: 0 16px 16px !important;
    }

  @media (prefers-reduced-motion: reduce) {
    #rec3354439901 .ocs-card,
    #rec3354439901 .ocs-reveal {
      transition: none !important;
    }

</style>

<script>
(function () {
  'use strict';
  if (window.__ocsWarningCardsInit) return;
  window.__ocsWarningCardsInit = true;

  var REC_ID = '3354439901';
  var HOVER_BP = 1366;
  var CARD_SEL = ['.warningcard-1', '.warningcard-2', '.warningcard-3', '.warningcard-4'];
  var BODY_SEL = [
    '[data-elem-id="1787822252534000003"]',
    '[data-elem-id="1787822370860000008"]',
    '[data-elem-id="1787822403649000015"]',
    '[data-elem-id="1787822418398000022"]'
  ];
  var CTA_SEL = '[data-group-id="1787822608320000002"]';

  function q(sel, root) {
    return (root || document).querySelector(sel);
  }

  function hoverMode() {
    return window.matchMedia('(min-width: ' + HOVER_BP + 'px)').matches;
  }

  /* Тильда на 320+upscale=window ставит zoom=clientWidth/320 на прямых детей артборда
     (.t396__group / .t396__elem). Стек — наш div, без зума 280px/213px остаются
     экранными и карточки уже заготовки (~380px) и наезжают на текст. */
  function tildaPhoneZoom(rec) {
    if (!window.matchMedia('(max-width: 767px)').matches) return '';
    var board = rec && q('.t396__artboard', rec);
    var kids = board ? board.children : [];
    var i;
    for (i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.classList.contains('ocs-stack')) continue;
      if ((el.classList.contains('tn-group') || el.classList.contains('t396__elem')) && el.style.zoom) {
        return el.style.zoom;
      }
    }
    var w = window.tn_scale_initial_window_width || document.documentElement.clientWidth;
    return (w / 320).toFixed(3);
  }

  function syncStackZoom(stack, rec) {
    if (!stack) return;
    var z = tildaPhoneZoom(rec);
    stack.style.zoom = z || '';
  }

  function nextTextSibling(header) {
    var el = header.nextElementSibling;
    while (el) {
      if (el.classList.contains('ocs-stack') || el.classList.contains('ocs-card')) {
        el = el.nextElementSibling;
        continue;
      }
      if (el.matches('.t396__elem[data-elem-type="text"]')) return el;
      if (CARD_SEL.some(function (s) { return el.matches(s); })) return null;
      el = el.nextElementSibling;
    }
    return null;
  }

  function prepareBody(el) {
    if (!el) return;
    el.classList.add('ocs-body');
    el.classList.remove('t-animate', 't396__elem--anim-hidden', 't-animate_paused');
    el.style.position = 'relative';
    el.style.top = 'auto';
    el.style.left = 'auto';
    el.style.width = '100%';
    el.style.height = '';
    el.style.minHeight = '0';
    el.style.maxHeight = '';
    el.style.opacity = '';
    el.style.visibility = '';
    el.style.transform = 'none';
  }

  function setOpen(card, open, stack) {
    var cards = stack.querySelectorAll('.ocs-card');
    Array.prototype.forEach.call(cards, function (c) {
      var on = open && c === card;
      c.classList.toggle('is-open', on);
      c.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
  }

  function bindStack(stack) {
    if (stack.getAttribute('data-ocs-bound') === '1') return;
    stack.setAttribute('data-ocs-bound', '1');

    stack.addEventListener('click', function (e) {
      if (hoverMode()) return;
      if (e.target.closest('a, button, .tn-atom__button-text')) return;
      var card = e.target.closest('.ocs-card');
      if (!card || !stack.contains(card)) return;
      setOpen(card, !card.classList.contains('is-open'), stack);
    });

    stack.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.ocs-card');
      if (!card || !stack.contains(card)) return;
      e.preventDefault();
      setOpen(card, !card.classList.contains('is-open'), stack);
    });
  }

  function wrapOnce(rec) {
    if (q('.ocs-stack', rec)) return q('.ocs-stack', rec);
    var board = q('.t396__artboard', rec);
    if (!board) return null;

    var headers = CARD_SEL.map(function (s) { return q(s, rec); });
    if (headers.some(function (h) { return !h; })) return null;

    var stack = document.createElement('div');
    stack.className = 'ocs-stack';
    board.appendChild(stack);

    headers.forEach(function (header, i) {
      var card = document.createElement('div');
      card.className = 'ocs-card';
      if (i === 3) card.classList.add('ocs-card--fade');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-expanded', 'false');

      var body = q(BODY_SEL[i], rec) || nextTextSibling(header);
      stack.appendChild(card);
      card.appendChild(header);

      var reveal = document.createElement('div');
      reveal.className = 'ocs-reveal';
      var inner = document.createElement('div');
      inner.className = 'ocs-reveal-inner';
      reveal.appendChild(inner);
      card.appendChild(reveal);

      if (body) {
        prepareBody(body);
        inner.appendChild(body);
      }
    });

    var cta = q(CTA_SEL, rec);
    if (cta) {
      cta.classList.add('ocs-cta');
      stack.appendChild(cta);
    }

    rec.classList.add('ocs-ready');
    bindStack(stack);
    syncStackZoom(stack, rec);
    return stack;
  }

  function boot() {
    var rec = document.getElementById('rec' + REC_ID);
    if (!rec) return;
    var stack = wrapOnce(rec);
    if (stack) syncStackZoom(stack, rec);
  }

  function start() {
    boot();
    if (!q('#rec' + REC_ID + ' .ocs-stack')) {
      var tries = 0;
      var t = setInterval(function () {
        tries += 1;
        boot();
        if (q('#rec' + REC_ID + ' .ocs-stack') || tries > 40) clearInterval(t);
      }, 100);
    }
    setTimeout(function () {
      var rec = document.getElementById('rec' + REC_ID);
      if (rec) syncStackZoom(q('.ocs-stack', rec), rec);
    }, 300);
    window.addEventListener('resize', function () {
      var rec = document.getElementById('rec' + REC_ID);
      if (!rec) return;
      syncStackZoom(q('.ocs-stack', rec), rec);
      if (hoverMode()) {
        Array.prototype.forEach.call(rec.querySelectorAll('.ocs-card.is-open'), function (c) {
          c.classList.remove('is-open');
          c.setAttribute('aria-expanded', 'false');
        });
      }
    });
  }

  if (typeof t_onReady === 'function') {
    t_onReady(function () {
      if (typeof t_onFuncLoad === 'function') {
        t_onFuncLoad('t396_init', function () { setTimeout(start, 60); });
      } else {
        setTimeout(start, 60);
      }
    });
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
