<!-- ============================================================
     MAIN SLIDER (карусель по кругу) для Tilda Zero Block

     Как подключить:
     1. Зеро-блок #rec2651850801 — источник контента.
        В нём должны лежать 6 элементов/групп (классы задаются
        в Settings -> CSS Class Name). Соответствие задаётся
        явно в массиве SLIDE_SOURCES в скрипте ниже:
          Слайд 1 — .slide1 / .mob-slide1
          Слайд 2 — .slide2 / .mob-slide2
          … и так до слайда 6.
        Сам блок будет скрыт — на странице он не отображается.
     2. В другом зеро-блоке:
        - добавьте Shape (фрейм) и дайте ему класс  main-slider
          (слайдер построится внутри него, активный слайд
          центрируется по фрейму);
        - добавьте стрелки с классами  slider-left  и  slider-right;
        - между ними — текстовый элемент с классом  slider-text
          (текст подменяется скриптом под каждый слайд).
     3. Добавьте в любой из этих блоков (или в настройки страницы)
        элемент "HTML" и вставьте весь код из этого файла.
     4. Тексты для слайдов поменяйте в массиве SLIDE_TEXTS,
        классы источников — в массиве SLIDE_SOURCES (ниже в скрипте).
     5. Если слайд — группа из нескольких картинок, нижний слой
        статичен, а все слои над ним слегка «парят» (случайное
        движение до 20px и поворот до 15 градусов).

     Поведение:
     - 6 слайдов формата 16:9, крутятся по кругу;
     - активный слайд по центру, боковые — в 2 раза меньше
       и с маской (сверху 100% -> снизу 0% прозрачность);
     - автопролистывание каждые 8 секунд, прогресс — фиолетовое
       кольцо #8742EE (2px) вплотную к кнопке slider-right;
     - при наведении курсора на слайды автопролистывание на паузе;
     - анимация смены — 1.5 секунды; текст slider-text меняется
       фейдом, стрелки при этом плавно скользят под новую ширину.
============================================================ -->

<style>
  /* Блок-источник контента скрыт, но продолжает рассчитывать layout:
     это нужно, чтобы читать реальные позиции элементов внутри групп
     (.slide1 может быть группой из нескольких картинок). */
  #rec2651850801 {
    position: absolute !important;
    top: -100000px !important;
    left: 0 !important;
    width: 100% !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* фрейм не должен резать боковые слайды */
  .main-slider,
  .main-slider .tn-atom {
    overflow: visible !important;
  }

  .msl-stage {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* размер активного слайда (16:9) по брейкпоинтам */
    --msl-w: 280px;
    --msl-h: 158px;
    --msl-gap: 4vw; /* зазор между центральным и боковыми слайдами */
  }
  @media (min-width: 768px) {
    .msl-stage { --msl-w: 725px;  --msl-h: 408px; }
  }
  @media (min-width: 1024px) {
    .msl-stage { --msl-w: 860px;  --msl-h: 484px; }
  }
  @media (min-width: 1366px) {
    .msl-stage { --msl-w: 1100px; --msl-h: 619px; }
  }
  @media (min-width: 1920px) {
    .msl-stage { --msl-w: 1260px; --msl-h: 709px; }
  }

  .msl-card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--msl-w);
    height: var(--msl-h);
    margin-left: calc(var(--msl-w) / -2);
    margin-top: calc(var(--msl-h) / -2);
    border-radius: 24px;
    overflow: hidden;
    /* фон не задаём: у слайдов с прозрачным PNG не должно быть подложки */
    background: transparent;
    pointer-events: auto;
    will-change: transform;

    /* маска: верх непрозрачный, низ уходит в 0.
       Градиент в 2 раза выше карточки, анимируется его позиция:
       0 0    — виден полностью «чёрный» участок (маски нет),
       0 100% — виден участок с фейдом 100% -> 0% (маска включена). */
    -webkit-mask-image: linear-gradient(to bottom, #000 50%, rgba(0,0,0,0) 100%);
    -webkit-mask-size: 100% 200%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: 0 0;
    mask-image: linear-gradient(to bottom, #000 50%, rgba(0,0,0,0) 100%);
    mask-size: 100% 200%;
    mask-repeat: no-repeat;
    mask-position: 0 0;

    /* изинг с быстрым стартом: слайд трогается сразу после заполнения
       кольца / клика, без ощущения задержки */
    transition:
      transform 1.5s cubic-bezier(.25, .1, .25, 1),
      opacity 1.5s cubic-bezier(.25, .1, .25, 1),
      -webkit-mask-position 1.5s cubic-bezier(.25, .1, .25, 1),
      mask-position 1.5s cubic-bezier(.25, .1, .25, 1);
  }

  /* позиции карусели */
  .msl-pos--center {
    transform: translateX(0) scale(1);
    z-index: 3;
  }
  .msl-pos--left,
  .msl-pos--right {
    z-index: 2;
    -webkit-mask-position: 0 100%;
    mask-position: 0 100%;
  }
  .msl-pos--left {
    transform: translateX(calc(var(--msl-w) * -0.75 - var(--msl-gap))) scale(0.5);
  }
  .msl-pos--right {
    transform: translateX(calc(var(--msl-w) * 0.75 + var(--msl-gap))) scale(0.5);
  }
  .msl-pos--hidl,
  .msl-pos--hidr {
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    -webkit-mask-position: 0 100%;
    mask-position: 0 100%;
  }
  .msl-pos--hidl {
    transform: translateX(calc(var(--msl-w) * -1.5 - var(--msl-gap) * 2)) scale(0.5);
  }
  .msl-pos--hidr {
    transform: translateX(calc(var(--msl-w) * 1.5 + var(--msl-gap) * 2)) scale(0.5);
  }

  /* контент карточки: десктоп / мобайл */
  .msl-face {
    position: absolute;
    inset: 0;
    display: none;
  }
  .msl-face img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .msl-face--desktop { display: block; }
  @media (max-width: 767px) {
    .msl-face--desktop { display: none; }
    .msl-face--mobile  { display: block; }
  }

  /* парение декоративных элементов внутри слайда-группы
     (нижний слой статичен, слои над ним плавают со случайными
     параметрами — см. compositeHTML) */
  @keyframes msl-float {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--msl-fx, 0px), var(--msl-fy, -10px)) rotate(var(--msl-fr, 5deg)); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .msl-float {
    animation: msl-float var(--msl-fd, 5s) ease-in-out infinite;
    will-change: transform;
  }

  /* заглушка, если элемент-источник не найден */
  .msl-ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 600 48px/1 sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #8742ee, #b09aff);
  }

  /* элементы управления */
  .slider-left, .slider-right,
  .slider-left .tn-atom, .slider-right .tn-atom {
    cursor: pointer;
  }
  /* Текст меняется в три фазы: фейд-аут 0.5с (ширина не трогается,
     старый текст не режется) -> ширина едет 0.5с, стрелки скользят,
     пока текст скрыт -> фейд-ин 0.5с.
     overflow + min-width:0 — иначе при удлинении текста flex
     мгновенно раздувает блок (min-width:auto = ширина контента)
     и стрелки «прыгают» наружу. Сами transition дублируются
     инлайном из скрипта — надёжнее против пересчётов Тильды. */
  .slider-text {
    transition: width 0.5s cubic-bezier(.25, .1, .25, 1);
    white-space: nowrap;
    text-align: center;
    overflow: hidden;
    min-width: 0 !important;
  }
  .slider-text .tn-atom {
    transition: opacity 0.5s ease;
  }

  /* кольцо прогресса — conic-gradient вплотную к кнопке.
     Без SVG-dasharray/подложки: незаполненная часть реально пустая,
     поэтому «полное» кольцо = момент смены слайда, без ложной паузы. */
  .msl-ring {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    background: conic-gradient(
      from 0deg,
      var(--msl-ring-color, #8742EE) calc(var(--msl-p, 0) * 1turn),
      transparent 0
    );
    -webkit-mask: radial-gradient(farthest-side,
      transparent calc(100% - var(--msl-ring-w, 2px)),
      #000 calc(100% - var(--msl-ring-w, 2px)));
    mask: radial-gradient(farthest-side,
      transparent calc(100% - var(--msl-ring-w, 2px)),
      #000 calc(100% - var(--msl-ring-w, 2px)));
  }

  /* до готовности: без transition и невидимы — иначе при первой
     отрисовке / ресайзе Тильды слайды «прыгают» 1.5с */
  .msl-stage:not(.msl-ready) {
    opacity: 0;
  }
  .msl-stage:not(.msl-ready) .msl-card {
    transition: none !important;
  }
  .msl-stage.msl-ready {
    opacity: 1;
  }
</style>

<script>
(function () {
  'use strict';

  /* ==================== НАСТРОЙКИ ==================== */

  var SOURCE_BLOCK = '#rec2651850801';  /* зеро-блок с контентом слайдов   */

  /* классы элементов-источников для каждого слайда:
     desktop — экраны от 768px, mobile — до 768px.
     Если mobile-элемента нет на странице, показывается desktop. */
  var SLIDE_SOURCES = [
    { desktop: 'slide1', mobile: 'mob-slide1' },  /* Слайд 1 */
    { desktop: 'slide2', mobile: 'mob-slide2' },  /* Слайд 2 */
    { desktop: 'slide3', mobile: 'mob-slide3' },  /* Слайд 3 */
    { desktop: 'slide4', mobile: 'mob-slide4' },  /* Слайд 4 */
    { desktop: 'slide5', mobile: 'mob-slide5' },  /* Слайд 5 */
    { desktop: 'slide6', mobile: 'mob-slide6' }   /* Слайд 6 */
  ];

  var AUTOPLAY_MS = 8000;               /* автопролистывание, мс           */
  var RING_COLOR  = '#8742EE';          /* цвет кольца прогресса           */
  var RING_WIDTH  = 2;                  /* толщина кольца, px              */

  /* парение элементов слайда-группы (все слои над нижним) */
  var FLOAT_MAX_SHIFT  = 20;            /* максимальное движение, px       */
  var FLOAT_MAX_ROTATE = 15;            /* максимальный поворот, градусы   */

  /* тексты под каждый слайд (временные, по 4-5 слов) */
  var SLIDE_TEXTS = [
    'Интерактивная доска для занятий',
    'Совместная работа в реальном времени',
    'Видеосвязь прямо на доске',
    'Готовые шаблоны для быстрого старта',
    'Стикеры, заметки и задачи',
    'Работает на любом устройстве'
  ];

  /* =================================================== */

  var SLIDES = SLIDE_SOURCES.length;

  /* rel = (i - active + N) % N  ->  позиция в карусели.
     Следующий слайд (rel 1) стоит слева и приходит в центр,
     активный (rel 0 -> 5) уменьшается и уходит вправо. */
  var POS = {
    0: 'center',
    1: 'left',
    2: 'hidl',
    3: 'hidl',
    4: 'hidr',
    5: 'right'
  };

  var active = 0;
  var cards = [];
  var stageEl = null;
  var textEl = null;
  var textAtom = null;
  var textTimers = [];
  var measurer = null;
  var ring = null;
  var autoplayStart = null;
  var lastFrame = null;
  var currentBp = null;

  function q(sel) { return document.querySelector(sel); }

  /* координаты без учёта transform (сбс-анимации Тильды не мешают) */
  function pageOffset(el) {
    var x = 0, y = 0;
    while (el) {
      x += el.offsetLeft;
      y += el.offsetTop;
      el = el.offsetParent;
    }
    return { x: x, y: y };
  }

  /* случайные параметры парения: движение до FLOAT_MAX_SHIFT px,
     поворот до FLOAT_MAX_ROTATE градусов, у каждого элемента свои */
  function floatStyle() {
    var rnd = function (min, max) { return min + Math.random() * (max - min); };
    var sign = function () { return Math.random() < 0.5 ? -1 : 1; };
    var shift = rnd(FLOAT_MAX_SHIFT * 0.4, FLOAT_MAX_SHIFT);
    var angle = rnd(shift / FLOAT_MAX_SHIFT, 1) * Math.PI * 2;
    return '--msl-fx:' + (Math.cos(angle) * shift).toFixed(1) + 'px;' +
      '--msl-fy:' + (Math.sin(angle) * shift).toFixed(1) + 'px;' +
      '--msl-fr:' + (sign() * rnd(FLOAT_MAX_ROTATE * 0.3, FLOAT_MAX_ROTATE)).toFixed(1) + 'deg;' +
      '--msl-fd:' + rnd(4, 7).toFixed(2) + 's;' +
      'animation-delay:-' + rnd(0, 4).toFixed(2) + 's;';
  }

  /* .slideN — группа из нескольких элементов: собираем все картинки,
     сохраняя их позиции и порядок слоёв внутри рамки группы.
     Нижний слой статичен, все слои над ним слегка «парят». */
  function compositeHTML(groupEl) {
    var elems = groupEl.querySelectorAll('.tn-elem');
    if (elems.length < 2) return null;
    var gw = groupEl.offsetWidth, gh = groupEl.offsetHeight;
    if (!gw || !gh) return null;
    var g = pageOffset(groupEl);
    var pct = function (v, base) { return (v / base * 100).toFixed(3); };
    var html = '';
    var isBase = true;
    for (var i = 0; i < elems.length; i++) {
      var e = elems[i];
      var img = e.querySelector('img');
      var src = img && (img.getAttribute('data-original') || img.getAttribute('src'));
      if (!src || !e.offsetWidth) continue;
      var o = pageOffset(e);
      html += '<img src="' + src + '" alt=""' +
        (isBase ? '' : ' class="msl-float"') +
        ' style="position:absolute;' +
        'left:' + pct(o.x - g.x, gw) + '%;' +
        'top:' + pct(o.y - g.y, gh) + '%;' +
        'width:' + pct(e.offsetWidth, gw) + '%;' +
        'height:' + pct(e.offsetHeight, gh) + '%;' +
        'object-fit:fill;' +
        (isBase ? '' : floatStyle()) + '">';
      isBase = false;
    }
    return html || null;
  }

  function elementHTML(el) {
    var comp = compositeHTML(el);
    if (comp) return comp;

    var img = el.querySelector('img');
    var src = img && (img.getAttribute('data-original') || img.getAttribute('src'));
    if (src) return '<img src="' + src + '" alt="">';

    var atom = el.querySelector('.tn-atom') || el;
    var bg = (atom.getAttribute('data-original') || '');
    if (!bg && atom.style) {
      var m = (atom.style.backgroundImage || '').match(/url\(["']?([^"')]+)/);
      if (m) bg = m[1];
    }
    if (bg) return '<img src="' + bg + '" alt="">';

    /* не картинка — переносим содержимое как есть */
    if (atom.innerHTML && atom.innerHTML.replace(/\s/g, '')) {
      return '<div style="width:100%;height:100%;">' + atom.innerHTML + '</div>';
    }
    return null;
  }

  /* --- достаём контент слайда из блока-источника --- */
  function faceHTML(n, mobile) {
    var root = q(SOURCE_BLOCK) || document;
    var srcCfg = SLIDE_SOURCES[n - 1];
    var el = root.querySelector('.' + (mobile ? srcCfg.mobile : srcCfg.desktop));
    /* мобильной версии нет — показываем десктопную, а не заглушку */
    if (!el && mobile) el = root.querySelector('.' + srcCfg.desktop);
    if (el) {
      var res = elementHTML(el);
      if (res) return res;
    }
    return '<div class="msl-ph">' + n + '</div>';
  }

  function fillFaces(card, n) {
    card.innerHTML =
      '<div class="msl-face msl-face--desktop">' + faceHTML(n, false) + '</div>' +
      '<div class="msl-face msl-face--mobile">'  + faceHTML(n, true)  + '</div>';
  }

  /* --- построение слайдера --- */
  function build(frame) {
    var host = frame.querySelector('.tn-atom') || frame;
    var stage = document.createElement('div');
    stage.className = 'msl-stage';

    for (var i = 1; i <= SLIDES; i++) {
      var card = document.createElement('div');
      /* позиционный класс сразу при создании, чтобы при загрузке
         не проигрывалась анимация «разлёта» из центра */
      card.className = 'msl-card msl-pos--' + POS[(i - 1 - active + SLIDES) % SLIDES];
      fillFaces(card, i);
      (function (idx) {
        card.addEventListener('click', function () {
          /* клик по боковому слайду тоже переключает */
          var rel = (idx - active + SLIDES) % SLIDES;
          if (rel === 1) next();
          else if (rel === SLIDES - 1) prev();
        });
      })(i - 1);
      stage.appendChild(card);
      cards.push(card);
    }
    host.appendChild(stage);
    stageEl = stage;
  }

  function render() {
    for (var i = 0; i < SLIDES; i++) {
      var rel = (i - active + SLIDES) % SLIDES;
      cards[i].className = 'msl-card msl-pos--' + POS[rel];
    }
    setText();
  }

  /* ширина текста измеряется невидимым дублёром с тем же шрифтом */
  function textWidth(str) {
    if (!measurer) {
      measurer = document.createElement('span');
      measurer.style.cssText =
        'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;';
      var cs = getComputedStyle(textAtom);
      measurer.style.font = cs.font;
      measurer.style.letterSpacing = cs.letterSpacing;
      measurer.style.textTransform = cs.textTransform;
      document.body.appendChild(measurer);
    }
    measurer.textContent = str;
    return Math.ceil(measurer.getBoundingClientRect().width);
  }

  /* смена текста в три фазы (итого 1.5с, как анимация слайдов):
     0
     фейд-аут старого текста 0.5с, ширина не трогается —
       старый текст не режется схлопывающимся боксом;
     0.5с
     текст скрыт: подмена строки + ширина плавно едет 0.5с,
       стрелки в это время скользят;
     1.0с
     фейд-ин нового текста 0.5с. */
  function setText() {
    if (!textAtom) return;
    var str = SLIDE_TEXTS[active % SLIDE_TEXTS.length] || '';
    textTimers.forEach(clearTimeout);
    textTimers = [];

    /* transition инлайном: стили Тильды их не перебьют */
    textAtom.style.transition = 'opacity 0.5s ease';
    textEl.style.transition = 'width 0.5s cubic-bezier(.25,.1,.25,1)';

    /* фиксируем текущую ширину в px: Тильда при пересчётах может
       вернуть width:auto, а переход auto->px не анимируется (скачок) */
    textEl.style.width = textEl.getBoundingClientRect().width + 'px';

    textAtom.style.opacity = '0';

    textTimers.push(setTimeout(function () {
      textAtom.textContent = str;
      textEl.style.width = textWidth(str) + 'px';
    }, 500));

    textTimers.push(setTimeout(function () {
      textAtom.style.opacity = '1';
    }, 1000));
  }

  function next(t) {
    active = (active + 1) % SLIDES;
    autoplayStart = (typeof t === 'number') ? t : performance.now();
    render();
  }

  function prev(t) {
    active = (active - 1 + SLIDES) % SLIDES;
    autoplayStart = (typeof t === 'number') ? t : performance.now();
    render();
  }

  /* --- кольцо прогресса вокруг slider-right --- */
  function buildRing(btn) {
    ring = document.createElement('div');
    ring.className = 'msl-ring';
    ring.style.setProperty('--msl-p', '0');
    ring.style.setProperty('--msl-ring-color', RING_COLOR);
    ring.style.setProperty('--msl-ring-w', RING_WIDTH + 'px');

    var cs = getComputedStyle(btn);
    if (cs.position === 'static') btn.style.position = 'relative';
    btn.appendChild(ring);
  }

  function setRingProgress(p) {
    if (ring) ring.style.setProperty('--msl-p', String(Math.max(0, Math.min(1, p))));
  }

  /* --- автопролистывание + анимация кольца --- */
  function loop(now) {
    if (autoplayStart === null) autoplayStart = now;
    if (lastFrame === null) lastFrame = now;
    /* Пауза только при наведении на ЦЕНТРАЛЬНЫЙ слайд.
       :hover каждый кадр — не залипает, когда слайд уезжает
       из-под неподвижного курсора. */
    var hovered = stageEl && stageEl.querySelector('.msl-pos--center:hover');
    if (hovered) autoplayStart += now - lastFrame;
    lastFrame = now;

    var p = (now - autoplayStart) / AUTOPLAY_MS;
    if (p >= 1) {
      setRingProgress(1);
      next(now); /* сбрасывает autoplayStart в now */
      p = 0;
    }
    setRingProgress(p);
    requestAnimationFrame(loop);
  }

  function breakpointId() {
    var w = window.innerWidth;
    if (w >= 1920) return '1920';
    if (w >= 1366) return '1366';
    if (w >= 1024) return '1024';
    if (w >= 768) return '768';
    return '320';
  }

  /* включаем transition только после стабильной первой отрисовки */
  function markReady() {
    if (!stageEl || stageEl.classList.contains('msl-ready')) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (stageEl) stageEl.classList.add('msl-ready');
      });
    });
  }

  /* --- инициализация --- */
  function init() {
    var frame = q('.main-slider');
    build(frame);

    textEl = q('.slider-text');
    if (textEl) textAtom = textEl.querySelector('.tn-atom') || textEl;

    var left = q('.slider-left');
    var right = q('.slider-right');
    if (left) left.addEventListener('click', prev);
    if (right) {
      right.addEventListener('click', next);
      buildRing(right);
    }

    /* первый текст без задержки; позиции уже расставлены в build() */
    if (textAtom) {
      textAtom.textContent = SLIDE_TEXTS[0];
      /* стартовая ширина, от которой будет анимироваться «скольжение» */
      textEl.style.width = textWidth(SLIDE_TEXTS[0]) + 'px';
    }

    /* пересобираем композицию только при реальной смене брейкпоинта —
       Тильда шлёт resize при инициализации, из-за чего слайды «прыгали» */
    currentBp = breakpointId();
    var resizeTimer = null;
    var initAt = Date.now();
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (Date.now() - initAt < 1000) return; /* игнор стартовых resize */
        var bp = breakpointId();
        if (bp === currentBp) return;
        currentBp = bp;
        stageEl.classList.remove('msl-ready'); /* без transition на пересборке */
        for (var i = 0; i < cards.length; i++) fillFaces(cards[i], i + 1);
        markReady();
      }, 250);
    });

    /* ждём загрузки картинок (или таймаут) — потом показываем сцену */
    var imgs = stageEl.querySelectorAll('img');
    var pending = imgs.length;
    var settled = false;
    function settle() {
      if (settled) return;
      settled = true;
      markReady();
    }
    if (!pending) settle();
    else {
      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].complete) {
          if (--pending === 0) settle();
        } else {
          imgs[i].addEventListener('load', function () {
            if (--pending === 0) settle();
          });
          imgs[i].addEventListener('error', function () {
            if (--pending === 0) settle();
          });
        }
      }
      setTimeout(settle, 1500);
    }

    autoplayStart = performance.now();
    requestAnimationFrame(loop);
  }

  /* ждём, пока Tilda отрисует зеро-блоки и разложит элементы */
  function waitAndInit() {
    var started = Date.now();
    (function poll() {
      var frame = q('.main-slider');
      var source = q(SOURCE_BLOCK + ' .' + SLIDE_SOURCES[0].desktop);
      var ready = source && source.offsetWidth > 0; /* t396 закончил layout */
      if (frame && (ready || Date.now() - started > 6000)) {
        init();
        return;
      }
      if (Date.now() - started < 20000) setTimeout(poll, 250);
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndInit);
  } else {
    waitAndInit();
  }
})();
</script>
